<script>
// window.storage поверх localStorage — у чаті це API середовища артефактів,
// локально його немає. Та сама форма відповідей, тож код гри не змінюється.
// Спільні ключі (shared=true, ранги) живуть під префіксом shared: — локально
// вони, звісно, видні лише тобі.
(function () {
  if (window.storage) return;
  const k = (key, shared) => (shared ? "shared:" : "own:") + key;
  window.storage = {
    async get(key, shared) {
      const v = localStorage.getItem(k(key, shared));
      if (v === null) throw new Error("not found");
      return { key, value: v, shared: !!shared };
    },
    async set(key, value, shared) {
      localStorage.setItem(k(key, shared), value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared) {
      localStorage.removeItem(k(key, shared));
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared) {
      const p = k(prefix || "", shared), keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const full = localStorage.key(i);
        if (full.startsWith(p)) keys.push(full.slice((shared ? "shared:" : "own:").length));
      }
      return { keys, prefix, shared: !!shared };
    },
  };
})();
</script>
