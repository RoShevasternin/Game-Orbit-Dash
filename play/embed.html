/* ═══ БРЕНД LEWYDO — стандарт студії, кіт як є ═══════════════════════════════
   Джерело: https://roshevasternin.github.io/brand/ (brand.json — усі числа),
   код — kit/code/web/lewydo-brand.css. Марку НЕ чіпаємо: часи, масштаби й криві
   keyframes нижче скопійовані з кіта без жодної зміни.
   Єдина відмінність — розкладка: кіт міряє в px через --lw-s, а прототип живе в
   юнітах екрана 360 (u(n) = n·100cqw/360), тож тут --lw-u. Числа ті самі:
   Lockup 208×322, логотип 208 (серце 140 по центру), назва 208×74, слоган 208×19,
   лінія 146×1 на 20 нижче. Фон і світло — наші (космос гри), марка — ні. */
.lw{--lw-u:calc(100cqw / 360)}
.lw-lockup{display:flex;flex-direction:column;align-items:center;width:calc(208 * var(--lw-u));height:calc(322 * var(--lw-u))}
.lw-logo{position:relative;display:block;flex:none;width:calc(208 * var(--lw-u));height:calc(208 * var(--lw-u))}
.lw-back,.lw-front,.lw-aura{position:absolute;display:block;transform-origin:50% 50%}
.lw-back{left:0;top:0;width:100%;height:100%}
.lw-front{left:16.346%;top:16.346%;width:67.308%;height:67.308%}      /* 140 з 208, по центру */
.lw-aura{left:0;top:0;width:100%;height:100%;opacity:0;pointer-events:none}
.lw-name{display:block;flex:none;width:calc(208 * var(--lw-u));height:calc(74 * var(--lw-u))}
.lw-slogan{display:block;flex:none;width:calc(208 * var(--lw-u));height:calc(19 * var(--lw-u))}
.lw-line{display:block;flex:none;width:calc(146 * var(--lw-u));height:calc(1 * var(--lw-u));min-height:1px;margin-top:calc(20 * var(--lw-u))}

/* Підпис — логотип 24 + назва 46.1×16.4; пігулка меню кладе його в капсулу 28 з › */
.lw-sig{display:inline-flex;align-items:center;gap:calc(1 * var(--lw-u))}
.lw-sig .lw-logo{width:calc(24 * var(--lw-u));height:calc(24 * var(--lw-u))}
.lw-sig .lw-name{width:calc(46.1 * var(--lw-u));height:calc(16.4 * var(--lw-u))}
.lw-pill{display:inline-flex;align-items:center;gap:calc(5 * var(--lw-u));height:calc(28 * var(--lw-u));
  padding:0 calc(10 * var(--lw-u)) 0 calc(3 * var(--lw-u));border-radius:999px;border:1px solid rgba(61,220,132,.24);
  background:rgba(61,220,132,.04);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s ease}
.lw-pill:active{transform:scale(.96)}
/* Зона тапу 48 (кіт: pill.tapArea) — вигляд лишається 28: прозора обгортка, натиск тисне пігулку */
.lw-tap{background:none;border:0;padding:calc(10 * var(--lw-u)) 0;display:inline-flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;cursor:pointer}
.lw-tap:active .lw-pill{transform:scale(.96)}
.lw-pill .lw-go{width:calc(5 * var(--lw-u));height:calc(8 * var(--lw-u));opacity:.65}

/* Серцебиття — ОДИН раз, коли марка з'являється (ніколи в петлі): клас .lw-beating на .lw-logo */
.lw-beating .lw-front{animation:lwHeart 440ms linear var(--d,0s) 1;}
.lw-beating .lw-back{animation:lwGlow 450ms linear var(--d,0s) 1 forwards;}
@keyframes lwHeart{0%{transform:scale(1);animation-timing-function:cubic-bezier(.61,1,.88,1)}22.727%{transform:scale(1.13);animation-timing-function:cubic-bezier(.12,0,.39,0)}
  50%{transform:scale(1);animation-timing-function:cubic-bezier(.61,1,.88,1)}72.727%{transform:scale(1.07);animation-timing-function:cubic-bezier(.12,0,.39,0)}100%{transform:scale(1)}}
@keyframes lwGlow{0%,11.111%{transform:scale(1);animation-timing-function:cubic-bezier(.61,1,.88,1)}37.778%{transform:scale(1.15);animation-timing-function:cubic-bezier(.12,0,.39,0)}100%{transform:scale(1.05)}}

/* Сплеш (BrandScreen) — клас .lw-splash на .lw-lockup. Усе приїжджає згори вниз,
   далі серцебиття як фінал зі звуком Lewydo (2.09 с; його перший удар — на 0.03). */
.lw-splash .lw-logo{opacity:0;transform:scale(.94);animation:lwArrive .7s cubic-bezier(.22,1,.36,1) .15s forwards;}
.lw-splash .lw-front{animation:lwBeat 900ms linear 2s 1;}
.lw-splash .lw-back{animation:lwBloom 1000ms linear 2s 1 forwards;}
.lw-splash .lw-aura{animation:lwWave 1s cubic-bezier(.2,.7,.3,1) 2.12s 1;}
.lw-splash .lw-aura+.lw-aura{animation:lwWave2 .9s cubic-bezier(.2,.7,.3,1) 2.4s 1;}
.lw-splash .lw-name{opacity:0;transform:scale(1.06);animation:lwFocus .55s cubic-bezier(.5,0,.5,1) .55s forwards;}
.lw-splash .lw-slogan{opacity:0;transform:scale(1.06);animation:lwFocus .55s cubic-bezier(.5,0,.5,1) .85s forwards;}
.lw-splash .lw-line{opacity:0;transform:scaleX(0);animation:lwFadeIn .3s linear 1.15s forwards,lwOpen .7s cubic-bezier(.16,1,.3,1) 1.15s forwards;}
@keyframes lwArrive{to{opacity:1;transform:scale(1)}}
@keyframes lwFadeIn{to{opacity:1}}
@keyframes lwFocus{to{opacity:1;transform:scale(1)}}
@keyframes lwOpen{to{transform:scaleX(1)}}
@keyframes lwBeat{
  0%{transform:scale(1);animation-timing-function:cubic-bezier(.45,0,.55,1)}
  11%{transform:scale(.95);animation-timing-function:cubic-bezier(.2,.9,.3,1)}
  19%{transform:scale(1.2);animation-timing-function:cubic-bezier(.45,0,.55,1)}
  31%{transform:scale(.97);animation-timing-function:cubic-bezier(.2,.9,.3,1)}
  50%{transform:scale(1.12);animation-timing-function:cubic-bezier(.45,0,.55,1)}
  63%{transform:scale(.985);animation-timing-function:cubic-bezier(.45,0,.55,1)}
  80%{transform:scale(1.012)}
  100%{transform:scale(1)}}
@keyframes lwBloom{
  0%{transform:scale(1);filter:brightness(1)}
  12%{transform:scale(.98);filter:brightness(1);animation-timing-function:cubic-bezier(.2,.9,.3,1)}
  22%{transform:scale(1.3);filter:brightness(1.4);animation-timing-function:cubic-bezier(.45,0,.55,1)}
  40%{transform:scale(1.1);filter:brightness(1.1);animation-timing-function:cubic-bezier(.2,.9,.3,1)}
  52%{transform:scale(1.2);filter:brightness(1.25);animation-timing-function:cubic-bezier(.45,0,.55,1)}
  100%{transform:scale(1.05);filter:brightness(1)}}
@keyframes lwWave{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
@keyframes lwWave2{0%{opacity:.32;transform:scale(1)}100%{opacity:0;transform:scale(1.55)}}

@media (prefers-reduced-motion:reduce){
  .lw-beating .lw-front,.lw-beating .lw-back,.lw-splash .lw-front,.lw-splash .lw-back,.lw-splash .lw-aura{animation:none;}
  .lw-splash .lw-logo,.lw-splash .lw-name,.lw-splash .lw-slogan,.lw-splash .lw-line{animation:none;opacity:1;transform:none;}
}

    sndEl.innerHTML = (soundOn ? I_ON : I_OFF) + "<span>" + L.sound + "</span>";
    sndEl.setAttribute("aria-pressed", String(soundOn));
    sndEl.setAttribute("aria-label", L.sound);
    backEl.textContent = "‹ " + L.watch;
    waitEl.textContent = L.loading;
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script>

<div id="root"></div>
<script>
// window.storage поверх localStorage. У чаті це API середовища артефактів; на
// опублікованій сторінці й локально його немає. Форма відповідей та сама, тож
// код гри не змінюється. Якщо localStorage недоступний (приватний режим,
// заборона сховища) — тихо живемо в пам'яті, гра не падає.
(function () {
  if (window.storage) return;
  let ls = null;
  try { ls = window.localStorage; ls.setItem("__t", "1"); ls.removeItem("__t"); } catch (e) { ls = null; }
  const mem = new Map();
  const R = (k) => { try { return ls ? ls.getItem(k) : (mem.has(k) ? mem.get(k) : null); } catch (e) { return null; } };
  const W = (k, v) => { try { ls ? ls.setItem(k, v) : mem.set(k, v); } catch (e) { mem.set(k, v); } };
  const D = (k) => { try { ls ? ls.removeItem(k) : mem.delete(k); } catch (e) { mem.delete(k); } };
  const all = () => { try { if (!ls) return [...mem.keys()]; const a = []; for (let i = 0; i < ls.length; i++) a.push(ls.key(i)); return a; } catch (e) { return [...mem.keys()]; } };
  const pre = (shared) => (shared ? "od:shared:" : "od:own:");
  window.storage = {
    async get(key, shared) { const v = R(pre(shared) + key); if (v === null) throw new Error("not found"); return { key, value: v, shared: !!shared }; },
    async set(key, value, shared) { W(pre(shared) + key, value); return { key, value, shared: !!shared }; },
    async delete(key, shared) { D(pre(shared) + key); return { key, deleted: true, shared: !!shared }; },
    async list(prefix, shared) {
      const p = pre(shared), full = p + (prefix || "");
      return { keys: all().filter((k) => k.startsWith(full)).map((k) => k.slice(p.length)), prefix, shared: !!shared };
    },
  };
})();
</script>
