<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost in orbit — Orbit Dash</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e1024">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/png" sizes="32x32" href="/Game-Orbit-Dash/favicon-32.png">
<link rel="stylesheet" href="/Game-Orbit-Dash/assets/fonts/fonts.css">
<style>
:root{--bg:#0e1024;--deep:#060816;--player:#00e5ff;--gem:#ffd54a;--ring:#2b3060;
  --dim:rgba(255,255,255,.6);--line:rgba(255,255,255,.1);--card:rgba(255,255,255,.05)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;
  background:radial-gradient(70% 55% at 50% 30%,#1c2044 0%,var(--bg) 55%,var(--deep) 100%);
  color:#fff;font-family:"Exo 2",system-ui,sans-serif}
.mk{width:132px;height:132px;position:relative;margin:0 auto 30px;filter:drop-shadow(0 0 24px rgba(0,229,255,.45))}
.mk i{position:absolute;border:3px solid var(--ring);border-radius:50%}
.mk i:first-child{inset:0}.mk i:nth-child(2){inset:28px}
.mk s{position:absolute;inset:0;animation:sp 7s linear infinite}
.mk s::after{content:"";position:absolute;width:19px;height:19px;border-radius:50%;background:var(--player);
  top:-9.5px;left:50%;margin-left:-9.5px;box-shadow:0 0 18px var(--player)}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.mk s{animation:none}}
h1{font-family:"Unbounded",sans-serif;font-weight:900;font-size:clamp(46px,14vw,86px);
  letter-spacing:.06em;color:var(--gem);text-shadow:0 0 34px rgba(255,213,74,.55);line-height:1}
p{color:var(--dim);margin-top:16px;max-width:34ch}
a{display:inline-flex;align-items:center;justify-content:center;margin-top:28px;padding:14px 26px;
  border-radius:14px;background:var(--player);color:#04121a;font-weight:700;text-decoration:none;
  box-shadow:0 0 28px rgba(0,229,255,.36)}
a:active{transform:scale(.97)}
</style>
</head>
<body>
<div>
  <div class="mk" aria-hidden="true"><i></i><i></i><s></s></div>
  <h1>404</h1>
  <p>This orbit is empty. The ball went somewhere else.</p>
  <a href="/Game-Orbit-Dash/">Back to Orbit Dash</a>
</div>
</body>
</html>
