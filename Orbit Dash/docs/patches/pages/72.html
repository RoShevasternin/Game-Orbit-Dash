<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Патч 72 · Мікшер гучності</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"><script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/glsl.min.js"></script><style id="style">

</style></head><body><main class="page" id="root"></main><div class="bar" id="bar"><div class="bar-inner"><div class="status" id="status"></div><div class="bulk" id="bulk"></div><button class="send" id="send" type="button">Готово — надіслати Claude</button></div></div><script id="patch-data" type="application/json">{"id": "72", "title": "Мікшерний пульт: coff автора, повзунки гравця, майстер — і жодної системної гучності у формулі", "date": "22.09.2026", "order": "1 → 11 разом; компілюється після 6 (SoundUtil і MusicUtil читають AudioMixer).", "summaryHtml": "\u003ch3>Що і навіщо\u003c/h3>\n\u003cp>Гучність у грі рахувалась у двох місцях і обидва рахували неправильно. \u003ccode>SoundUtil\u003c/code> множив на системну гучність телефона, \u003ccode>MusicUtil\u003c/code> — теж, а Android накладає її \u003cstrong>ще раз\u003c/strong>, уже на рівні заліза. Виходив квадрат: на 50 % регулятора гра звучала на 25 %, на 25 % — на 6 %. Через це синтезовані звуки з патча 71 і здавались відсутніми — тап ішов на 4 % шкали.\u003c/p>\n\u003cp>Плюс дрібніші сліди того самого: \u003ccode>MusicUtil.coff\u003c/code> очікував 0..1, а \u003ccode>LoaderScreen\u003c/code> передавав \u003ccode>27f\u003c/code>; \u003ccode>volumeLevelFlow\u003c/code> у музиці ніхто не оновлював — підписка спрацьовувала раз і мовчала; \u003ccode>Settings.IS_MUSIC\u003c/code> читався як \u003ccode>currentMusic.isPlaying\u003c/code>, тобто «налаштування» самовільно перемикалось щоразу, коли музику глушила реклама або пауза; нічого не зберігалось.\u003c/p>\n\u003cp>Замість латання — \u003cstrong>один мікшерний пульт\u003c/strong> із трьома рівнями, у кожного рівно один господар:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>рівень\u003c/th>\u003cth>хто ставить\u003c/th>\u003cth>де живе\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>coff\u003c/code> — вага ассета в міксі\u003c/td>\u003ctd>\u003cstrong>автор\u003c/strong> (ми)\u003c/td>\u003ctd>у коді: пік рецепта для звуку, \u003ccode>MusicManager.EnumMusic\u003c/code> для треку\u003c/td>\u003c/tr>\u003ctr>\u003ctd>шина \u003ccode>MUSIC\u003c/code> / \u003ccode>SFX\u003c/code>\u003c/td>\u003ctd>\u003cstrong>гравець\u003c/strong>\u003c/td>\u003ctd>сейв, \u003ccode>PlayerData.volMusic\u003c/code> / \u003ccode>volSfx\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>майстер\u003c/td>\u003ctd>\u003cstrong>гравець\u003c/strong>\u003c/td>\u003ctd>сейв, \u003ccode>PlayerData.volMaster\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Системної гучності у формулі \u003cstrong>немає\u003c/strong> — вона не наша, її накладає Android поверх.\u003c/p>\n\u003cp>``\u003ccode>kotlin fun gain(coff, bus, master, headroom) = coff * curve(bus) * curve(master) * headroom \u003c/code>``\u003c/p>\n\u003ch3>Чому повзунок не лінійний\u003c/h3>\n\u003cp>Вухо чує гучність приблизно логарифмічно: половина амплітуди — це не «удвічі тихіше», а ледь помітно тихіше. Лінійний повзунок тому відчувається зламаним: перші 70 % ходу майже нічого не міняють, а решта різко глушить. \u003ccode>curve(x) = x²\u003c/code> — це −12 дБ на середині ходу, і хід стає рівномірним на слух. Кожна шина проходить криву окремо, тож два повзунки на 50 % дають −24 дБ — рівно як два фейдери на −12 дБ у справжньому пульті.\u003c/p>\n\u003ch3>Запас під суму\u003c/h3>\n\u003cp>\u003ccode>SoundPool\u003c/code> мікс просто \u003cstrong>додає\u003c/strong> доріжки. Тап + гем + комбо можуть зійтись у тих самих 50 мс і дати суму понад одиницю — це кліп, чутний як тріск. \u003ccode>SFX_HEADROOM = 0.8\u003c/code> лишає ~2 дБ запасу; музиці він не потрібен, доріжка одна.\u003c/p>\n\u003ch3>Скільки це в числах\u003c/h3>\n\u003cp>Гучність, яку застосунок віддає \u003ccode>Sound.play()\u003c/code> (найгучніший рецепт каталогу = ORBIT3):\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>звук\u003c/th>\u003cth>патч 71\u003c/th>\u003cth>71 + фікс 3.2\u003c/th>\u003cth>\u003cstrong>72\u003c/strong>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>UI_TICK (кнопка)\u003c/td>\u003ctd>0.036\u003c/td>\u003ctd>0.115\u003c/td>\u003ctd>\u003cstrong>0.155\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TAP\u003c/td>\u003ctd>0.042\u003c/td>\u003ctd>0.134\u003c/td>\u003ctd>\u003cstrong>0.181\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>GEM\u003c/td>\u003ctd>0.059\u003c/td>\u003ctd>0.188\u003c/td>\u003ctd>\u003cstrong>0.254\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DEATH\u003c/td>\u003ctd>0.090\u003c/td>\u003ctd>0.288\u003c/td>\u003ctd>\u003cstrong>0.388\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ORBIT3\u003c/td>\u003ctd>0.185\u003c/td>\u003ctd>0.593\u003c/td>\u003ctd>\u003cstrong>0.800\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>І головне: тепер це лінійно щодо регулятора телефона. 50 % на телефоні = 50 % гучності, а не 25 %.\u003c/p>\n\u003cp>Магічне \u003ccode>SYNTH_GAIN = 3.2\u003c/code> зникло: \u003ccode>coff\u003c/code> рахується як \u003ccode>пік рецепта / пік найгучнішого\u003c/code>, тобто каталог сам себе калібрує. Додаси гучніший звук — решта перебалансується.\u003c/p>\n\u003ch3>Коли зʼявляться повзунки в налаштуваннях\u003c/h3>\n\u003cp>Усе вже готове, екрану лишається один рядок на повзунок:\u003c/p>\n\u003cp>``\u003ccode>kotlin aSliderMusic.onChange { gdxGame.settings.MUSIC_VOLUME = it }   // 0..1 \u003c/code>``\u003c/p>\n\u003cul>\u003cli>\u003cstrong>музика реагує на льоту\u003c/strong> — \u003ccode>MusicUtil\u003c/code> підписаний на \u003ccode>AudioMixer.musicBusFlow\u003c/code>, гучність міняється, поки палець ще на повзунку;\u003c/li>\u003cli>\u003cstrong>ефекти\u003c/strong> беруть нове значення з наступним \u003ccode>play()\u003c/code> — підписка їм не потрібна;\u003c/li>\u003cli>\u003cstrong>значення зберігається\u003c/strong>: \u003ccode>saveGame()\u003c/code> у сеттері свідомо не кличемо — повзунок тягнуть пальцем, диск не має молотити під кожен піксель ходу. Автозбереження (30 с) і запис на паузі це покривають.\u003c/li>\u003c/ul>\n\u003cp>\u003ccode>IS_SOUND\u003c/code> / \u003ccode>IS_MUSIC\u003c/code> лишились як тумблери над повзунками (\u003ccode>&gt; 0\u003c/code> / \u003ccode>0f\u003c/code> чи \u003ccode>1f\u003c/code>) — але джерело правди тепер сейв, а не стан програвача.\u003c/p>\n\u003ch3>Заодно вичищено\u003c/h3>\n\u003cp>\u003ccode>MusicUtil\u003c/code> переписаний: замість \u003ccode>currentMusic = MAIN.apply { isLooping = …; coff = … }\u003c/code> — \u003ccode>play(EnumMusic.MAIN)\u003c/code>. Мертвий \u003ccode>volumeLevelFlow\u003c/code> прибрано. \u003ccode>AudioManager\u003c/code> (обгортка над системним) більше ніхто не читає — лишив файл на місці, він знадобиться для audio focus (дзвінок, чужа музика), але зараз у тракті його немає.\u003c/p>\n\u003ch3>Ціна й перевірка\u003c/h3>\n\u003cp>Нуль: одне множення на звук замість двох, потік музики оновлюється лише коли змінилось значення (\u003ccode>distinctUntilChanged\u003c/code>). Три нові поля в сейві з дефолтами — міграція не потрібна за правилами \u003ccode>PlayerDataMigration\u003c/code>.\u003c/p>\n\u003cp>\u003ccode>assembleDebug\u003c/code> — BUILD SUCCESSFUL. Тести: \u003cstrong>8 нових\u003c/strong> (\u003ccode>AudioMixerTest\u003c/code>) + 9 \u003ccode>SoundSynth\u003c/code> + 24 \u003ccode>:engine\u003c/code> + 1 = 42 зелені. Тести стережуть саме те, через що звук уже зникав: що системна гучність не входить у формулу, що −12 дБ на середині, що баланс між звуками не залежить від положення повзунка, що ніщо не вилітає за 0..1.\u003c/p>\n\u003cp>\u003cstrong>Не перевірено:\u003c/strong> як воно звучить. \u003ccode>coff\u003c/code> треку \u003ccode>MAIN = 0.27\u003c/code> — це число з твого старого \u003ccode>//27f\u003c/code>, я його лише переніс у правильне місце; коли ввімкнеш музику, баланс із ефектами треба буде послухати.\u003c/p>", "files": [{"path": "app/src/main/java/com/lewydo/orbitdash/game/manager/util/AudioMixer.kt", "note": "НОВИЙ ФАЙЛ: уся формула гучності в одному місці. curve() = x², запас під суму, шина музики потоком.", "lang": "kotlin", "hunks": [{"verb": "create", "where": "створити", "old": null, "new": "package com.lewydo.orbitdash.game.manager.util\n\nimport com.lewydo.orbitdash.game.utils.gdxGame\nimport kotlinx.coroutines.flow.Flow\nimport kotlinx.coroutines.flow.combine\nimport kotlinx.coroutines.flow.distinctUntilChanged\n\n// ----------------------------------------------------------------------------\n//  МІКШЕРНИЙ ПУЛЬТ — ОДНЕ МІСЦЕ, ДЕ ГУЧНІСТЬ ПЕРЕТВОРЮЄТЬСЯ НА ЧИСЛО.\n//\n//  Тракт має рівно три рівні, і в кожного один господар:\n//\n//    coff  ─ АВТОР. Вага ассета в міксі, 0..1. Ставиться раз, при створенні:\n//            у синтезованих звуків рахується з піка рецепта, у треку стоїть\n//            у MusicManager.EnumMusic. Гравець її не бачить і не крутить.\n//    шина  ─ ГРАВЕЦЬ. Повзунки MUSIC і SFX у налаштуваннях, 0..1. Живуть у\n//            сейві (PlayerData.volMusic / volSfx), тож переживають перезапуск.\n//    майстер ─ ГРАВЕЦЬ. Один повзунок на все, 0..1 (PlayerData.volMaster).\n//\n//  І ВСЕ. Системної гучності телефона в формулі НЕМАЄ — її накладає Android\n//  поверх нашого числа. Раніше ми множили на неї самі, і вона прикладалась\n//  двічі: на 50 % гучності гра звучала на 25 %, на 25 % — на 6 %. Саме через\n//  це синтезовані звуки й здавались «відсутніми» (патч 71).\n//\n//  ── Чому повзунок не лінійний ───────────────────────────────────────────\n//  Вухо чує гучність приблизно логарифмічно: половина амплітуди — це не\n//  «удвічі тихіше», а ледь помітно тихіше. Лінійний повзунок тому відчувається\n//  зламаним: перші 70 % ходу майже нічого не міняють, а решта різко глушить.\n//  curve() = x² (−12 дБ на середині) робить хід рівномірним на слух. Кожна\n//  шина проходить криву окремо, тому два повзунки на 50 % дають −24 дБ — так\n//  само, як два фейдери на −12 дБ у справжньому пульті.\n//\n//  ── Запас під суму ──────────────────────────────────────────────────────\n//  SoundPool мікс просто ДОДАЄ доріжки. Тап + гем + комбо можуть зійтись у\n//  тих самих 50 мс і дати суму понад одиницю — це кліп, чутний як тріск.\n//  SFX_HEADROOM лишає 2 дБ запасу; музика його не потребує (доріжка одна).\n// ----------------------------------------------------------------------------\nobject AudioMixer {\n\n    /** Запас під суму одночасних ефектів. ~2 дБ: чутно не стає тихіше, кліпу немає. */\n    const val SFX_HEADROOM = 0.8f\n\n    // ── Чиста математика: без Gdx і без стану, тому тестується на JVM ───────\n\n    /** Повзунок 0..1 → підсилення 0..1. x²: рівномірно на слух, −12 дБ на середині. */\n    fun curve(slider: Float): Float = slider.coerceIn(0f, 1f).let { it * it }\n\n    /**\n     * Фінальне число для `Sound.play()` / `Music.volume`.\n     *\n     * @param coff     вага ассета (автор)\n     * @param bus      повзунок шини (гравець)\n     * @param master   майстер-повзунок (гравець)\n     * @param headroom запас під суму доріжок; 1 = без запасу\n     */\n    fun gain(coff: Float, bus: Float, master: Float, headroom: Float = 1f): Float =\n        (coff.coerceIn(0f, 1f) * curve(bus) * curve(master) * headroom).coerceIn(0f, 1f)\n\n    /** Формула ефекту з ЯВНИМИ повзунками: те саме, що sfx(), але без сейву — тести й дебаг. */\n    fun sfxAt(coff: Float, bus: Float, master: Float, playCoff: Float = 1f): Float =\n        gain(coff * playCoff.coerceIn(0f, 1f), bus, master, SFX_HEADROOM)\n\n    // ── Живі значення з сейву ───────────────────────────────────────────────\n\n    private val player get() = gdxGame.modelPlayer\n\n    /**\n     * Шина музики БЕЗ coff треку: master × music. Трек домножує свій coff сам —\n     * так один потік обслуговує будь-який трек, і зміна повзунка чутна одразу,\n     * поки палець ще на ньому.\n     */\n    val musicBusFlow: Flow\u003cFloat>\n        get() = combine(player.volMasterFlow, player.volMusicFlow) { m, mus ->\n            gain(1f, mus, m)\n        }.distinctUntilChanged()\n\n    /** Те саме значення «просто зараз» — для щойно запущеного треку. */\n    fun musicBus(): Float = gain(1f, player.volMusic, player.volMaster)\n\n    /** Гучність ефекту: вага ассета × шина SFX × майстер × запас. */\n    fun sfx(coff: Float, playCoff: Float = 1f): Float =\n        sfxAt(coff, player.volSfx, player.volMaster, playCoff)\n\n    /** Ефекти вимкнені повзунком — черга навіть не потрібна. */\n    val isSfxSilent: Boolean get() = player.volSfx \u003c= 0f || player.volMaster \u003c= 0f\n}", "id": "1.1"}]}, {"path": "app/src/test/java/com/lewydo/orbitdash/game/manager/util/AudioMixerTest.kt", "note": "НОВИЙ ФАЙЛ: 8 тестів чистої математики — зокрема що системна гучність у формулу НЕ входить.", "lang": "kotlin", "hunks": [{"verb": "create", "where": "створити", "old": null, "new": "package com.lewydo.orbitdash.game.manager.util\n\nimport org.junit.Assert.assertEquals\nimport org.junit.Assert.assertTrue\nimport org.junit.Test\nimport kotlin.math.abs\nimport kotlin.math.log10\n\n/**\n * Чиста математика пульта — без Gdx і без сейву. Стережемо рівно те, через що\n * звук уже одного разу зник: щоб системна гучність не прикладалась двічі,\n * щоб повзунок ішов рівно на слух і щоб нічого не вилітало за 0..1.\n */\nclass AudioMixerTest {\n\n    private fun db(gain: Float) = 20.0 * log10(gain.toDouble())\n\n    @Test\n    fun `усе на максимумі — це запас, а не одиниця`() {\n        // Найгучніший звук каталогу (coff 1) при всіх повзунках на максимум\n        assertEquals(AudioMixer.SFX_HEADROOM, AudioMixer.sfxAt(1f, 1f, 1f), 1e-6f)\n        // а музика запасу не потребує — доріжка одна\n        assertEquals(1f, AudioMixer.gain(1f, 1f, 1f), 1e-6f)\n    }\n\n    @Test\n    fun `повзунок на середині — мінус 12 дБ`() {\n        val g = AudioMixer.gain(1f, 0.5f, 1f)\n        assertEquals(0.25f, g, 1e-6f)\n        assertTrue(\"дБ=${db(g)}\", abs(db(g) + 12.0) \u003c 0.1)\n    }\n\n    @Test\n    fun `два повзунки складаються в дБ, як у пульті`() {\n        // −12 дБ (ши         const cur = (state.hunks[h.id] || {}).choice;
        [["manual", "self", "Вставив сам"], ["auto", "auto", "Вставити автоматично"]].forEach(([val, cls, label]) => {
          const b = el("button", cls, label);
          b.type = "button";
          b.setAttribute("aria-pressed", String(cur === val));
          b.disabled = locked;
          b.addEventListener("click", () => setChoice(h.id, val));
          choice.appendChild(b);
        });
        top.appendChild(choice);
        hb.appendChild(top);

        const lang = h.lang || f.lang;
        if (h.old != null) hb.appendChild(codeBlock("old", h.verb === "add" ? "Знайти (вже є у файлі)" : "Було", h.old, h.oldMarks, lang));
        if (h.new != null) hb.appendChild(codeBlock("new", h.verb === "create" ? "Файл цілком" : "Стало", h.new, h.newMarks, lang));
        card.appendChild(hb);
      });
      steps.appendChild(card);
    });
    root.appendChild(steps);
    window.scrollTo(0, scrollY);
  }

  // ── панель ───────────────────────────────────────────────────────────
  let artifactApi = null;
  let busy = false;

  function counts() {
    let self = 0, auto = 0, none = 0;
    allHunks.forEach((h) => {
      const c = (state.hunks[h.id] || {}).choice;
      if (c === "manual") self++; else if (c === "auto") auto++; else none++;
    });
    return { self, auto, none };
  }

  function renderBar() {
    const status = $("status"), bulk = $("bulk"), send = $("send");
    status.textContent = ""; bulk.textContent = "";
    const c = counts();

    if (state.result) {
      status.appendChild(el("span", "pill " + (state.result.ok ? "done" : "fail"), state.result.ok ? "Готово" : "Є проблеми"));
      status.appendChild(el("span", null, fmtTime(state.result.at)));
      if (state.result.note) status.appendChild(el("span", "note", state.result.note));
      send.hidden = true;
      return;
    }

    const tally = el("span", "tally", "сам " + c.self + " · авто " + c.auto + (c.none ? " · не обрано " + c.none : ""));
    status.appendChild(tally);

    if (submitted()) {
      status.appendChild(el("span", "pill pending", "Надіслано"));
      status.appendChild(el("span", "note", fmtTime(state.submitted) + " — Claude вставить «авто», перевірить «сам» і збере проєкт"));
      send.hidden = hasResults();
      send.className = "send ghost";
      send.textContent = "Змінити вибір";
      send.disabled = !artifactApi || busy;
      return;
    }

    if (!artifactApi) status.appendChild(el("span", "note", "надіслати можна на claude.ai; інакше напиши в чат"));
    else if (c.none) status.appendChild(el("span", "note", "обери для кожної зміни"));

    bulk.appendChild(el("span", null, "усе одразу:"));
    [["manual", "усе сам"], ["auto", "усе автоматично"], [null, "очистити"]].forEach(([val, label]) => {
      const b = el("button", "link", label);
      b.type = "button";
      b.addEventListener("click", () => {
        allHunks.forEach((h) => { (state.hunks[h.id] || (state.hunks[h.id] = {})).choice = val; });
        saveDraft(); render();
      });
      bulk.appendChild(b);
    });

    send.hidden = false;
    send.className = "send";
    send.textContent = c.none ? "Готово — ще " + c.none + " без вибору" : "Готово — надіслати Claude";
    send.disabled = !artifactApi || busy || c.none > 0;
  }

  function render() { renderPage(); renderBar(); }

  // Документ = незмінні частини + новий стан; живий DOM не серіалізуємо
  const HEAD_EXTRA =
    '<link rel="preconnect" href="https://fonts.googleapis.com">' +
    '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>' +
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">' +
    '<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"><\/script>' +
    '<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/glsl.min.js"><\/script>';
  const BAR =
    '<div class="bar" id="bar"><div class="bar-inner">' +
    '<div class="status" id="status"></div><div class="bulk" id="bulk"></div>' +
    '<button class="send" id="send" type="button">Готово — надіслати Claude</button>' +
    '</div></div>';

  function buildDocument() {
    const style = document.getElementById("style").outerHTML;
    const app = document.getElementById("app").textContent;
    const json = JSON.stringify(data).replace(/</g, "\\u003c");
    return "<!doctype html><html lang=\"uk\"><head><meta charset=\"utf-8\">" +
      "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">" +
      "<title>" + document.title.replace(/</g, "&lt;") + "</title>" + HEAD_EXTRA + style +
      "</head><body><main class=\"page\" id=\"root\"></main>" + BAR +
      "<script id=\"patch-data\" type=\"application/json\">" + json + "<\/script>" +
      "<script id=\"app\">" + app + "<\/script></body></html>";
  }

  async function publish() {
    busy = true; renderBar();
    try {
      await artifactApi.publish(buildDocument());
      try { localStorage.removeItem(DRAFT_KEY); } catch (e) { /* немає сховища */ }
    } catch (e) {
      busy = false;
      const code = e && e.code;
      if (code === "conflict") return;
      state.submitted = null;
      render();
      $("status").appendChild(el("span", "note", code === "not_writer" || code === "not_granted"
        ? "у тебе немає права змінювати цю сторінку"
        : "не вдалось надіслати — напиши в чат"));
    }
  }

  $("send").addEventListener("click", () => {
    if (!artifactApi || busy) return;
    if (submitted()) {           // «Змінити вибір» — поки Claude не почав
      if (hasResults()) return;
      state.submitted = null;
    } else {
      if (counts().none > 0) return;
      state.submitted = new Date().toISOString();
    }
    publish();
  });

  loadDraft();
  render();

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then((api) => { artifactApi = api; renderBar(); })
      .catch(() => { artifactApi = null; renderBar(); });
  }
})();
</script></body></html>
