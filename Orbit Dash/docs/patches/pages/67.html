* { box-sizing: border-box; }

</style></head><body><main class="page" id="root"></main><div class="bar" id="bar"><div class="bar-inner"><div class="status" id="status"></div><div class="bulk" id="bulk"></div><button class="send" id="send" type="button">Готово — надіслати Claude</button></div></div><script id="patch-data" type="application/json">{"id": "67", "title": "Віньєтка: полагодити вставку в лейаут + кільця, іскорки, хвилі", "date": "21.09.2026", "order": "1 — критичне: без нього в проєкті не видно поля. Далі 2–3 (ефекти), 4–5 (рушій і тести).", "summaryHtml": "\u003ch3>Що і навіщо\u003c/h3>\n\u003cp>Патч 66 поклав віньєтку в гру, але \u003cstrong>в проєкті він зараз зламаний\u003c/strong>: \u003ccode>addActor(aVignette)\u003c/code> у констрейнт-лейаут клав сирого актора повз його реєстр, лейаут переставав стежити за якорями — і \u003cstrong>поле їхало за екран\u003c/strong> (\u003ccode>y = −356\u003c/code>), тобто зникало взагалі. Перше, що робить цей патч, — виправляє це. Далі — характер бустів із прототипу.\u003c/p>\n\u003ch3>1. Вставка в лейаут\u003c/h3>\n\u003cp>\u003ccode>add(aVignette) { fillParent() }\u003c/code> замість \u003ccode>addActor\u003c/code>. Правило, яке варто знати про цей лейаут загалом: \u003cstrong>дітей у нього кладуть тільки через \u003ccode>add()\u003c/code>\u003c/strong> — інакше ламається не той актор, якого додали, а сусіди, чиї констрейнти на щось посилаються.\u003c/p>\n\u003ch3>2. Центр — екран, радіус — до найдальшого кута\u003c/h3>\n\u003cp>На пристрої видно два різні промахи. Перший: квад рахувався від півдіагоналі (490 юнітів), а від центру до нижніх кутів 548 — градієнт фізично не діставав низу екрана. Тепер радіус іде від \u003cstrong>найдальшого кута\u003c/strong> (\u003ccode>ROUT_K = 1.064\u003c/code> — те саме співвідношення, що в прототипі: 800 px при 752).\u003c/p>\n\u003cp>Другий: з центром на полі низ горів, а верхні кути лишались чистими — у прототипі поле майже посеред кадру (9:16), у нас екран 9:20.6 і поле високо. Обрано \u003cstrong>центр екрана\u003c/strong>: рамка рівна з усіх боків.\u003c/p>\n\u003ch3>3. Характер бустів\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>буст\u003c/th>\u003cth>що додалось\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>MAGNET\u003c/td>\u003ctd>три кільця стягуються з-за краю до поля й товщають на підльоті\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SLOW-MO\u003c/td>\u003ctd>дві тонкі хвилі, навпаки, розходяться назовні, гребінь світліший за край\u003c/td>\u003c/tr>\u003ctr>\u003ctd>GEM x2\u003c/td>\u003ctd>16 іскорок спалахують у точках периметра: ореол + чотирипроменева зірочка\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Плюс \u003cstrong>ореол магніта на м'ячі\u003c/strong> (прототип, рядок 1179): окремий шар кольору магніту, \u003ccode>130 ± 10 px\u003c/code> з пульсом 8 рад/с, альфа 0.5. Пульс зроблено масштабом, а не розміром: розмір лежить у реєстрі дизайн-одиниць, і крутити його щокадру означало б \u003ccode>freeScaled()\u003c/code>.\u003c/p>\n\u003ch3>Чим малюються кільця — і чому не шейдером\u003c/h3>\n\u003cp>Спершу я зробив їх на \u003ccode>ARingProgress\u003c/code> (наш шейдер із патча 65) — радіус і товщина там окремі юніформи, тобто «товщає на підльоті» виходить точно. \u003cstrong>Заміряно на пристрої:\u003c/strong>\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>FPS\u003c/th>\u003cth>кадр\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>ARingProgress\u003c/code> ×3\u003c/td>\u003ctd>56\u003c/td>\u003ctd>17.9 мс\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ShapeDrawer\u003c/td>\u003ctd>\u003cstrong>60\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>16.7 мс\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Причина: шейдерне кільце платить за \u003cstrong>весь квад\u003c/strong>, а він більший за екран; ShapeDrawer кладе в батч саму смужку. Вигляд однаковий, тому лишається ShapeDrawer — і він не чужий у проєкті: це той самий \u003ccode>drawerUtil\u003c/code>, з якого всі \u003ccode>VfxImage\u003c/code> беруть білий регіон.\u003c/p>\n\u003cp>Іскорки GEM x2 — власний \u003ccode>draw()\u003c/code> по периметру, як \u003ccode>ABurst\u003c/code>: msdf-ореол плюс два тонкі квади на зірочку. Жодної алокації в кадрі, позиції псевдовипадкові від номера циклу, тож та сама секунда дає ту саму картинку — як у прототипі.\u003c/p>\n\u003ch3>4. SLOW-MO нарешті сповільнює\u003c/h3>\n\u003cp>У прототипі множник 0.6 і 4 секунди; ми скопіювали це точно, і на око воно майже не читалось. Тепер \u003cstrong>6 секунд і 0.45\u003c/strong> — \u003ccode>RunEngine.SLOW_SCALE\u003c/code> поруч із рештою правил бігу.\u003c/p>\n\u003cp>Два тести в \u003ccode>:engine\u003c/code>: що світ під бустом справді йде повільніше рівно в \u003ccode>SLOW_SCALE\u003c/code> разів (кут міряється з урахуванням обороту через нуль — без цього тест бреше) і що тривалість саме 6 секунд. Разом 24 тести, зелені.\u003c/p>\n\u003ch3>Перевірено на пристрої\u003c/h3>\n\u003cp>\u003ccode>e48e5230\u003c/code>, 720×1650. MAGNET — кільця й фіолетова рамка, 60 FPS. SLOW-MO — біла рамка й хвилі, 60 FPS. Постійна чорна віньєтка вмикається кнопкою \u003ccode>VIGNETTE\u003c/code>. \u003cstrong>GEM x2 очима ще не бачив\u003c/strong> — за півгодини спроб буст жодного разу не впіймався наосліп; код той самий, що в решти, але чесно кажу: не перевірено.\u003c/p>", "files": [{"path": "app/src/main/java/com/lewydo/orbitdash/game/screens/GameScreen.kt", "note": "add() замість addActor() — саме через це зникало поле. Плюс magnetOn на м'яч.", "lang": "kotlin", "hunks": [{"verb": "replace", "where": "біля рядка 103", "old": "\n    /** Периферійний сигнал активного буста + постійна чорна віньєтка. */\n    private val aVignette  by lazy { AVignette(this) }\n    private val aComet     by lazy { AComet(this) }\n", "new": "\n    /** Периферійний сигнал активного буста + постійна чорна віньєтка. */\n    private val aVignette by lazy { AVig != RunEngine.Boost.FRENZY) return\n\n            val a = color.a * parentAlpha\n            if (a \u003c= 0.004f) return\n\n            val col  = b.info.color\n            val prev = batch.packedColor\n            // «lighter» прототипу: іскорка складається з тим, що під нею\n            batch.setBlendFunction(GL20.GL_SRC_ALPHA, GL20.GL_ONE)\n\n            val m   = SPARK_MARGIN\n            val w   = width  - 2f * m\n            val h   = height - 2f * m\n            val per = 2f * (w + h)\n\n            for (k in 0 until SPARK_N) {\n                val cyc = time * SPARK_SPEED + k * 0.618f          // золотий перетин — рівні фази\n                val n   = MathUtils.floor(cyc)\n                val f   = cyc - n\n                val amp = sin(f * MathUtils.PI).let { it * it } * power\n                if (amp \u003c 0.02f) continue\n\n                // нова точка периметра на кожен цикл; без random у кадрі —\n                // та сама секунда дає ту саму картинку, як у прототипі\n                val rnd = abs(sin((n + 1) * 78.233f + k * 12.9898f) * 43758.5453f) % 1f\n                var d = rnd * per\n                val sx: Float\n                val sy: Float\n                when {\n                    d \u003c w            -> { sx = m + d;             sy = m }\n                    d - w \u003c h        -> { d -= w;          sx = m + w;     sy = m + d }\n                    d - w - h \u003c w    -> { d -= w + h;      sx = m + w - d; sy = m + h }\n                    else             -> { d -= 2f * w + h; sx = m;         sy = m + h - d }\n                }\n\n                val g = SPARK_GLOW\n                batch.setColor(col.r, col.g, col.b, (amp * SPARK_GLOW_A * a).coerceAtMost(1f))\n                batch.draw(glow, x + sx - g * 0.5f, y + sy - g * 0.5f, g, g)\n\n                // чотирипроменева зірочка — два тонкі квади білим регіоном\n                val ray = SPARK_RAY + SPARK_RAY_A * amp\n                batch.setColor(hi(col.r), hi(col.g), hi(col.b), (function () {
  "use strict";

  const data = JSON.parse(document.getElementById("patch-data").textContent);
  const state = data.state || (data.state = {});
  state.hunks = state.hunks || {};

  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };
  const fmtTime = (iso) => {
    try { return new Date(iso).toLocaleString("uk-UA", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }); }
    catch (e) { return iso || ""; }
  };

  const allHunks = [];
  data.files.forEach((f) => f.hunks.forEach((h) => allHunks.push(h)));

  const submitted = () => !!state.submitted;
  const hasResults = () => allHunks.some((h) => state.hunks[h.id] && state.hunks[h.id].result);

  // Чернетка вибору до «Готово» — лише в цьому браузері; не вдалось — не страшно
  const DRAFT_KEY = "patch-draft-" + data.id;
  function loadDraft() {
    if (submitted()) return;
    try {
      const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || "{}");
      Object.keys(d).forEach((id) => {
        if (allHunks.some((h) => h.id === id)) state.hunks[id] = { choice: d[id] };
      });
    } catch (e) { /* немає сховища */ }
  }
  function saveDraft() {
    try {
      const d = {};
      Object.keys(state.hunks).forEach((id) => { if (state.hunks[id].choice) d[id] = state.hunks[id].choice; });
      localStorage.setItem(DRAFT_KEY, JSON.stringify(d));
    } catch (e) { /* немає сховища */ }
  }

  // ── підсвітка: блок цілком (коментарі на кілька рядків), потім різання на рядки ──
  function highlight(text, lang) {
    const hl = window.hljs;
    if (!hl || !lang || !hl.getLanguage(lang)) return null;
    try { return hl.highlight(text, { language: lang, ignoreIllegals: true }).value; }
    catch (e) { return null; }
  }
  function splitHtmlLines(htmlText) {
    const lines = [];
    let cur = "";
    const open = [];
    const re = /(<span[^>]*>)|(<\/span>)|(\n)|([^<\n]+|<(?!\/?span)[^>]*>)/g;
    let m;
    while ((m = re.exec(htmlText))) {
      if (m[1]) { open.push(m[1]); cur += m[1]; }
      else if (m[2]) { open.pop(); cur += m[2]; }
      else if (m[3]) { cur += "</span>".repeat(open.length); lines.push(cur); cur = open.join(""); }
      else cur += m[4];
    }
    lines.push(cur);
    return lines;
  }
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", "");
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
      ta.remove();
      return ok;
    }
  }

  function codeBlock(kind, label, text, marks, lang) {
    const box = el("div", "code " + kind);
    const head = el("div", "code-label");
    head.appendChild(el("span", null, label));
    const btn = el("button", "copy", "Копіювати");
    btn.type = "button";
    btn.addEventListener("click", async () => {
      const ok = await copyText(text);
      btn.textContent = ok ? "Скопійовано" : "Не вдалось";
      setTimeout(() => { btn.textContent = "Копіювати"; }, 1600);
    });
    head.appendChild(btn);
    box.appendChild(head);

    const pre = el("pre");
    const code = el("code");
    const hl = highlight(text, lang);
    const lines = hl != null ? splitHtmlLines(hl) : text.split("\n").map(escapeHtml);
    code.innerHTML = lines.map((l, i) => {
      const cls = marks ? (marks[i] ? "ln chg" : "ln ctx") : "ln";
      return '<span class="' + cls + '">' + (l || "") + "</span>";
    }).join("");
    pre.appendChild(code);
    box.appendChild(pre);
    return box;
  }

  const VERB = { replace: "ЗАМІНИТИ", add: "ДОДАТИ", remove: "ВИДАЛИТИ", create: "НОВИЙ ФАЙЛ", delete: "ВИДАЛИТИ ФАЙЛ" };

  function hunkStatus(h) {
    const s = state.hunks[h.id];
    if (!s || !s.choice) return el("span", "pill new", "не обрано");
    if (s.result) {
      const p = el("span", "pill " + (s.result.ok ? "done" : "fail"), s.result.note || (s.result.ok ? "готово" : "не вийшло"));
      return p;
    }
    if (submitted()) return el("span", "pill pending", s.choice === "auto" ? "Claude вставляє" : "Claude перевіряє");
    return null;
  }

  function setChoice(id, choice) {
    if (submitted()) return;
    const s = state.hunks[id] || (state.hunks[id] = {});
    s.choice = s.choice === choice ? null : choice;
    saveDraft();
    render();
  }

  function renderPage() {
    const root = $("root");
    const scrollY = window.scrollY;
    root.textContent = "";

    const head = el("header", "head");
    const eyebrow = el("div", "eyebrow");
    eyebrow.appendChild(el("span", "num", "патч " + data.id));
    if (data.date) eyebrow.appendChild(el("span", null, data.date));
    head.appendChild(eyebrow);
    head.appendChild(el("h1", null, data.title));
    root.appendChild(head);

    // summaryHtml генерує Claude з власного .md — довірений вміст
    const summary = el("section", "summary");
    summary.innerHTML = data.summaryHtml || "";
    root.appendChild(summary);

    const steps = el("section", "steps");
    const t = el("div", "steps-title");
    t.appendChild(el("h2", null, "Зміни"));
    t.appendChild(el("p", null, (data.order ? data.order + " " : "") +
      "Біля кожної зміни обери, хто її вставляє, потім «Готово» внизу."));
    steps.appendChild(t);

    const locked = submitted();
    data.files.forEach((f, fi) => {
      const card = el("article", "file");
      const fh = el("div", "file-head");
      const fid = el("div", "file-id");
      fid.appendChild(el("span", "idx", String(fi + 1)));
      fid.appendChild(el("span", "path", f.path));
      fh.appendChild(fid);
      if (f.hunks.length > 1) {
        const all = el("div", "file-all");
        all.appendChild(el("span", null, "увесь файл:"));
        [["self", "сам"], ["auto", "авто"]].forEach(([c, label]) => {
          const b = el("button", "link", label);
          b.type = "button";
          b.disabled = locked;
          b.addEventListener("click", () => {
            f.hunks.forEach((h) => { (state.hunks[h.id] || (state.hunks[h.id] = {})).choice = c === "self" ? "manual" : "auto"; });
            saveDraft(); render();
          });
          all.appendChild(b);
        });
        fh.appendChild(all);
      }
      card.appendChild(fh);
      if (f.note) card.appendChild(el("p", "file-note", f.note));

      f.hunks.forEach((h) => {
        const hb = el("div", "hunk");
        const top = el("div", "hunk-top");
        const ht = el("div", "hunk-title");
        ht.appendChild(el("span", "hid", h.id));
        ht.appendChild(el("span", "verb " + h.verb, VERB[h.verb] || h.verb));
        if (h.where) ht.appendChild(el("span", "where", h.where));
        const st = hunkStatus(h);
        if (st && (locked || !state.hunks[h.id] || !state.hunks[h.id].choice)) ht.appendChild(st);
        top.appendChild(ht);

        const choice = el("div", "choice");
        choice.setAttribute("role", "group");
        choice.setAttribute("aria-label", "Хто вставляє зміну " + h.id);
        const cur = (state.hunks[h.id] || {}).choice;
        [["manual", "self", "Вставив сам"], ["auto", "auto", "Вставити автоматично"]].forEach(([val, cls, label]) => {
          const b = el("button", cls, label);
          b.type = "button";
          b.setAttribute("aria-pressed", String(cur === val));
          b.disabled = locked;
          b.addEventListener("click", () => setChoice(h.id, val));
          choice.appendChild(b);
        });
        top.appendChild(choice);
        hb.appendChild(top);

        const lang = h.lang || f.lang;
        if (h.old != null) hb.appendChild(codeBlock("old", h.verb === "add" ? "Знайти (вже є у файлі)" : "Було", h.old, h.oldMarks, lang));
        if (h.new != null) hb.appendChild(codeBlock("new", h.verb === "create" ? "Файл цілком" : "Стало", h.new, h.newMarks, lang));
        card.appendChild(hb);
      });
      steps.appendChild(card);
    });
    root.appendChild(steps);
    window.scrollTo(0, scrollY);
  }

  // ── панель ───────────────────────────────────────────────────────────
  let artifactApi = null;
  let busy = false;

  function counts() {
    let self = 0, auto = 0, none = 0;
    allHunks.forEach((h) => {
      const c = (state.hunks[h.id] || {}).choice;
      if (c === "manual") self++; else if (c === "auto") auto++; else none++;
    });
    return { self, auto, none };
  }

  function renderBar() {
    const status = $("status"), bulk = $("bulk"), send = $("send");
    status.textContent = ""; bulk.textContent = "";
    const c = counts();

    if (state.result) {
      status.appendChild(el("span", "pill " + (state.result.ok ? "done" : "fail"), state.result.ok ? "Готово" : "Є проблеми"));
      status.appendChild(el("span", null, fmtTime(state.result.at)));
      if (state.result.note) status.appendChild(el("span", "note", state.result.note));
      send.hidden = true;
      return;
    }

    const tally = el("span", "tally", "сам " + c.self + " · авто " + c.auto + (c.none ? " · не обрано " + c.none : ""));
    status.appendChild(tally);

    if (submitted()) {
      status.appendChild(el("span", "pill pending", "Надіслано"));
      status.appendChild(el("span", "note", fmtTime(state.submitted) + " — Claude вставить «авто», перевірить «сам» і збере проєкт"));
      send.hidden = hasResults();
      send.className = "send ghost";
      send.textContent = "Змінити вибір";
      send.disabled = !artifactApi || busy;
      return;
    }

    if (!artifactApi) status.appendChild(el("span", "note", "надіслати можна на claude.ai; інакше напиши в чат"));
    else if (c.none) status.appendChild(el("span", "note", "обери для кожної зміни"));

    bulk.appendChild(el("span", null, "усе одразу:"));
    [["manual", "усе сам"], ["auto", "усе автоматично"], [null, "очистити"]].forEach(([val, label]) => {
      const b = el("button", "link", label);
      b.type = "button";
      b.addEventListener("click", () => {
        allHunks.forEach((h) => { (state.hunks[h.id] || (state.hunks[h.id] = {})).choice = val; });
        saveDraft(); render();
      });
      bulk.appendChild(b);
    });

    send.hidden = false;
    send.className = "send";
    send.textContent = c.none ? "Готово — ще " + c.none + " без вибору" : "Готово — надіслати Claude";
    send.disabled = !artifactApi || busy || c.none > 0;
  }

  function render() { renderPage(); renderBar(); }

  // Документ = незмінні частини + новий стан; живий DOM не серіалізуємо
  const HEAD_EXTRA =
    '<link rel="preconnect" href="https://fonts.googleapis.com">' +
    '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>' +
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">' +
    '<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"><\/script>' +
    '<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/glsl.min.js"><\/script>';
  const BAR =
    '<div class="bar" id="bar"><div class="bar-inner">' +
    '<div class="status" id="status"></div><div class="bulk" id="bulk"></div>' +
    '<button class="send" id="send" type="button">Готово — надіслати Claude</button>' +
    '</div></div>';

  function buildDocument() {
    const style = document.getElementById("style").outerHTML;
    const app = document.getElementById("app").textContent;
    const json = JSON.stringify(data).replace(/</g, "\\u003c");
    return "<!doctype html><html lang=\"uk\"><head><meta charset=\"utf-8\">" +
      "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">" +
      "<title>" + document.title.replace(/</g, "&lt;") + "</title>" + HEAD_EXTRA + style +
      "</head><body><main class=\"page\" id=\"root\"></main>" + BAR +
      "<script id=\"patch-data\" type=\"application/json\">" + json + "<\/script>" +
      "<script id=\"app\">" + app + "<\/script></body></html>";
  }

  async function publish() {
    busy = true; renderBar();
    try {
      await artifactApi.publish(buildDocument());
      try { localStorage.removeItem(DRAFT_KEY); } catch (e) { /* немає сховища */ }
    } catch (e) {
      busy = false;
      const code = e && e.code;
      if (code === "conflict") return;
      state.submitted = null;
      render();
      $("status").appendChild(el("span", "note", code === "not_writer" || code === "not_granted"
        ? "у тебе немає права змінювати цю сторінку"
        : "не вдалось надіслати — напиши в чат"));
    }
  }

  $("send").addEventListener("click", () => {
    if (!artifactApi || busy) return;
    if (submitted()) {           // «Змінити вибір» — поки Claude не почав
      if (hasResults()) return;
      state.submitted = null;
    } else {
      if (counts().none > 0) return;
      state.submitted = new Date().toISOString();
    }
    publish();
  });

  loadDraft();
  render();

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then((api) => { artifactApi = api; renderBar(); })
      .catch(() => { artifactApi = null; renderBar(); });
  }
})();
</script></body></html>
