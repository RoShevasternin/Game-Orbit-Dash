<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Патч 50 · Іскра комбо</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"><script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/glsl.min.js"></script><style id="style">

* { box-sizing: border-box; }
body {
  background: var(--ground);
  color: var(--text);
  font: 15px/1.6 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
.page { max-width: 880px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 190px; }
h1, h2, h3 { font-family: "IBM Plex Sans", system-ui, sans-serif; letter-spacing: -.01em; text-wrap: balance; line-height: 1.25; margin: 0; }
h1 { font-size: 26px; font-weight: 700; }
h2 { font-size: 19px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 600; }
code, pre { font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace; }
:not(pre) > code {
  font-size: .88em; background: var(--sunk); border: 1px solid var(--line);
  border-radius: 4px; padding: 0 4px; overflow-wrap: anywhere;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; }

/* ── шапка ─────────────────────────────────────────── */
.head { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.num { font-family: "JetBrains Mono", monospace; font-weight: 500; letter-spacing: 0; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; }

.pill {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  font-size: 12px; font-weight: 600; letter-spacing: .03em; border-radius: 999px; padding: 2px 10px;
}
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.new     { color: var(--muted); background: var(--sunk); border: 1px solid var(--line); }
.pill.pending { color: var(--gem);   background: var(--gem-bg); }
.pill.done    { color: var(--good);  background: var(--good-bg); }
.pill.fail    { color: var(--spike); background: var(--spike-bg); }

/* ── пояснення ─────────────────────────────────────── */
.summary { max-width: 68ch; }
.summary > * + * { margin-top: 12px; }
.summary h3 { margin-top: 22px; }
.summary ul { padding-left: 20px; margin-block: 8px; }
.summary li + li { margin-top: 4px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
.summary table { border-collapse: collapse; width: 100%; font-size: 14px; }
.summary th, .summary td { text-align: left; vertical-align: top; padding: 7px 10px; border-bottom: 1px solid var(--line); }
.summary tr:last-child td { border-bottom: 0; }
.summary th { font-weight: 600; background: var(--sunk); }

/* ── кроки ─────────────────────────────────────────── */
.steps { display: flex; flex-direction: column; gap: 26px; margin-top: 30px; }
.steps-title { display: flex; flex-direction: column; gap: 4px; }
.steps-title p { margin: 0; color: var(--muted); font-size: 13px; }
.file { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.file-head {
  display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; justify-content: space-between;
  padding: 10px 14px; background: var(--sunk); border-bottom: 1px solid var(--line);
}
.file-id { display: flex; gap: 10px; align-items: baseline; min-width: 0; }
.file-id .idx { font-family: "JetBrains Mono", monospace; color: var(--muted); font-weight: 500; flex: none; }
.file-id .path { font-family: "JetBrains Mono", monospace; font-size: 13px; overflow-wrap: anywhere; }
.file-all { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.link {
  background: none; border: 0; padding: 0; cursor: pointer; color: var(--accent);
  text-decoration: underline; text-underline-offset: 2px; font-size: 12px;
}
.link:disabled { color: var(--faint); cursor: default; text-decoration: none; }
.file-note { padding: 10px 14px 0; margin: 0; color: var(--muted); font-size: 13px; }

.hunk { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.hunk + .hunk { border-top: 1px dashed var(--line); }
.hunk-top { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.hunk-title { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; font-size: 13px; }
.hid { font-family: "JetBrains Mono", monospace; color: var(--muted); }
.verb { font-weight: 600; letter-spacing: .06em; font-size: 12px; }
.verb.replace { color: var(--gem); }
.verb.add, .verb.create { color: var(--good); }
.verb.remove, .verb.delete { color: var(--spike); }
.where { color: var(--muted); }

/* вибір на зміну */
.choice { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.choice button {
  background: var(--surface); color: var(--muted); border: 0; padding: 7px 11px; cursor: pointer;
  font-family: "IBM Plex Sans", system-ui, sans-serif; font-weight: 600; font-size: 12.5px;
}
.choice button + button { border-left: 1px solid var(--line); }
.choice button[aria-pressed="true"].self { background: var(--text); color: var(--surface); }
.choice button[aria-pressed="true"].auto { background: var(--accent); color: var(--accent-ink); }
.choice button:disabled { cursor: default; }
.choice button:disabled:not([aria-pressed="true"]) { opacity: .45; }

/* код */
.code { border-radius: 8px; border: 1px solid var(--line); overflow: hidden; }
.code-label {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 4px 6px 4px 10px;
}
.code-label { color: var(--muted); background: var(--surface); border-bottom: 1px solid var(--line); }
.code.old .code-label span:first-child::before { content: "● "; color: var(--spike); }
.code.new .code-label span:first-child::before { content: "● "; color: var(--good); }
.code pre {
  margin: 0; padding: 8px 0; overflow-x: auto; background: var(--sunk);
  font-size: 12.5px; line-height: 1.6; tab-size: 4;
}
.ln { display: block; white-space: pre; padding-right: 14px; min-height: 1.6em; }
.ln::before { content: " "; display: inline-block; width: 26px; text-align: center; color: var(--faint); user-select: none; }
.ln.ctx { opacity: .6; }
.code.old .ln.chg { background: var(--spike-bg); }
.code.old .ln.chg::before { content: "−"; color: var(--spike); }
.code.new .ln.chg { background: var(--good-bg); }
.code.new .ln.chg::before { content: "+"; color: var(--good); }
.copy {
  font: 500 11px/1 "IBM Plex Sans", system-ui, sans-serif; letter-spacing: .04em;
  color: inherit; background: transparent; border: 1px solid currentColor; border-radius: 6px;
  padding: 4px 8px; cursor: pointer;
}

.hljs-keyword, .hljs-built_in, .hljs-literal { color: var(--syn-kw); }
.hljs-type, .hljs-title.class_, .hljs-class .hljs-title { color: var(--syn-type); }
.hljs-title, .hljs-title.function_, .hljs-function .hljs-title { color: var(--syn-fn); }
.hljs-string, .hljs-char { color: var(--syn-str); }
.hljs-number { color: var(--syn-num); }
.hljs-comment, .hljs-doctag, .hljs-quote { color: var(--syn-com); font-style: italic; }
.hljs-meta, .hljs-annotation, .hljs-variable, .hljs-template-variable { color: var(--syn-meta); }

/* ── панель ────────────────────────────────────────── */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--surface); border-top: 1px solid var(--line); box-shadow: var(--shadow);
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
}
.bar-inner { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.status { font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.status .note { color: var(--muted); }
.tally { font-variant-numeric: tabular-nums; }
.bulk { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); align-items: center; }
.bulk .link { font-size: 13px; }
.send {
  font: 600 15px/1.2 "IBM Plex Sans", system-ui, sans-serif;
  border-radius: 12px; padding: 14px 12px; cursor: pointer; border: 2px solid var(--accent);
  background: var(--accent); color: var(--accent-ink); width: 100%;
}
.send.ghost { background: transparent; color: var(--accent); }
.send:disabled { opacity: .45; cursor: not-allowed; }
@media (max-width: 420px) { h1 { font-size: 22px; } .choice button { padding: 7px 8px; } }
@media (prefers-reduced-motion: no-preference) {
  .send, .choice button { transition: transform .08s ease, background-color .12s ease; }
  .send:active:not(:disabled) { transform: scale(.98); }
}
</style></head><body><main class="page" id="root"></main><div class="bar" id="bar"><div class="bar-inner"><div class="status" id="status"></div><div class="bulk" id="bulk"></div><button class="send" id="send" type="button">Готово — надіслати Claude</button></div></div><script id="patch-data" type="application/json">{"id": "50", "title": "Комбо = спіймана іскра біля шипа (з JSX-прототипу)", "date": "18.09.2026", "order": "Файли 1 → 5. Рушій і тести — разом (2 без 1 не скомпілюється), далі HUD, новий актор і GameScreen.", "summaryHtml": "\u003ch3>Що і навіщо\u003c/h3>\n\u003cp>Комбо в Kotlin досі за старим прототипом — near-miss за \u003cstrong>часом\u003c/strong>: тап за 16–84 мс до перетину. На внутрішньому кільці на старті цього вікна не існує фізично. Прототип JSX уже пішов далі: \u003cstrong>іскра\u003c/strong>. Переношу її 1:1.\u003c/p>\n\u003ch3>Правило\u003c/h3>\n\u003cp>Біля кожного шипа за \u003ccode>52\u003c/code> юніти \u003cstrong>попереду\u003c/strong> по ходу руху висить біла іскра. Гравець у вікні \u003ccode>±32\u003c/code> по дузі та \u003ccode>±45\u003c/code> по радіусу — іскра спіймана: комбо +1, бонус \u003ccode>5·множник\u003c/code>, таймер комбо заново. Вікно \u003cstrong>просторове\u003c/strong> — однакове на будь-якій швидкості й будь-якому кільці.\u003c/p>\n\u003cp>Іскра стоїть на кільці шипа ближче за зону зіткнення (\u003ccode>52−32 = 20 &lt; 37\u003c/code>), тому взяти її можна лише проходячи впритул. Радіус після тапу лерпиться \u003ccode>14/с\u003c/code>, тож вікно ±45 тримається ще ~1 кадр — «тапнув рівно на іскрі й полетів геть» зараховується. Для гравця: \u003cstrong>тапни, коли торкнувся іскри.\u003c/strong>\u003c/p>\n\u003ch3>Що звірено з JSX (md-спека місцями спрощує)\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>у спеці\u003c/th>\u003cth>у \u003ccode>orbit-dash-tutorial.jsx\u003c/code>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>orbA = norm(e.a − ORB_OFF / e.rr / D)\u003c/code>\u003c/td>\u003ctd>рядок 739 — так, \u003ccode>D = π/180\u003c/code>, тобто \u003ccode>/rr\u003c/code> в радіани і в градуси\u003c/td>\u003c/tr>\u003ctr>\u003ctd>підбір: \u003ccode>orb &amp;&amp; s &gt; 0.5 &amp;&amp; ±32 по дузі &amp;&amp; ±45 по радіусу\u003c/code>\u003c/td>\u003ctd>рядки 738–747 — так\u003c/td>\u003c/tr>\u003ctr>\u003ctd>старий \u003ccode>prevRel\u003c/code>-детектор лишився тільки для DEV EZ COMBO\u003c/td>\u003ctd>рядки 713–731 — так, комбо він більше не дає\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>nearMiss\u003c/code> кличеться з координатами \u003cstrong>іскри\u003c/strong>, не шипа\u003c/td>\u003ctd>рядки 743–745 — так\u003c/td>\u003c/tr>\u003ctr>\u003ctd>комбо до 10, множник до x5\u003c/td>\u003ctd>у Kotlin лишаю \u003ccode>MAX_COMBO = 8\u003c/code> — це наше рішення, не прототипу\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>Іскра — не сутність\u003c/h3>\n\u003cp>Стан — прапорець \u003ccode>Entity.orb\u003c/code> на шипі, кут рахує \u003ccode>RunEngine.sparkAngle(e)\u003c/code> щокадру (\u003ccode>null\u003c/code> — спіймано або не шип). Тому вона живе й помирає \u003cstrong>разом із шипом\u003c/strong>: PULSE, ревайв, \u003ccode>rel &lt; −60\u003c/code> — жодної окремої синхронізації. Вид тримає пул \u003ccode>ASpark\u003c/code> на \u003cstrong>id того ж шипа\u003c/strong>.\u003c/p>\n\u003cp>\u003ccode>Listener.onNearMiss\u003c/code> тепер віддає ще й \u003ccode>sparkAngle\u003c/code> — майбутні ефекти (попап, хвиля, партикли) стануть у точці іскри, а не шипа, як у прототипі.\u003c/p>\n\u003ch3>Вигляд\u003c/h3>\n\u003cp>Нової фігури в атласі немає: \u003ccode>msdf.circle\u003c/code> + \u003ccode>msdf.glow\u003c/code>, ті самі, що в м'яча й гема, обидва білі, у фреймі 18.\u003c/p>\n\u003cp>\u003cstrong>Крапка 4, і це СТЕЛЯ.\u003c/strong> Спершу зробив 6 (як r=3 у Figma-SVG) з пульсом ±15 % — на пристрої завелика. Тепер \u003ccode>DOT_SIZE = 4\u003c/code>, \u003ccode>GLOW_SIZE = 16\u003c/code> (пропорція 4:1 збережена), а пульс іде \u003cstrong>вниз від макета\u003c/strong>: \u003ccode>PULSE_MIN = 0.74\u003c/code> → 2.96..4, у піку рівно 4 і ніколи більше. 0.74 — не з голови: старе дихання 0.85..1.15 дає відношення 1.35, тут воно те саме, просто прив'язане стелею, а не серединою. Той самий принцип, що в \u003ccode>ASpike\u003c/code>: зона зіткнення не пульсує, тож і фігура не має здаватись ширшою за макет.\u003c/p>\n\u003cp>Фаза пульсу — кут шипа (іскри не дихають синхронно). Скейлимо дітей, не групу: transform-група — два флаші на кадр, а іскор до чотирнадцяти.\u003c/p>\n\u003ch3>Напис «COMBO x3» у точці іскри\u003c/h3>\n\u003cp>Порт \u003ccode>pop()\u003c/code> з прототипу: 26px на канві 720 при полі 640 = \u003cstrong>13 юнітів\u003c/strong> у нашому полі 320; підйом 50 px/с = 25 юнітів/с; життя 1/0.9 с, альфа лінійно 1 → 0. Зроблено на \u003ccode>Actions\u003c/code> (\u003ccode>moveBy\u003c/code> + \u003ccode>fadeOut\u003c/code> + \u003ccode>visible(false)\u003c/code>) — окремий клас не потрібен, \u003ccode>AMsdfLabel\u003c/code> і так final. Пул із чотирьох міток: немає вільної — подія лишається без напису (обірвати чужий на півдорозі гірше).\u003c/p>\n\u003cp>Стає рівно там, де була іскра — саме заради цього рушій і віддає \u003ccode>sparkAngle\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Множник поїхав у рушій.\u003c/strong> Напис показує \u003ccode>x3\u003c/code>, HUD показує \u003ccode>x3\u003c/code> — це одне правило, тож \u003ccode>RunEngine.multiplier\u003c/code> тепер публічний, а константа \u003ccode>MAX_MULT = 5\u003c/code> з \u003ccode>APanelGameHud\u003c/code> прибрана. Два читачі, одне джерело.\u003c/p>\n\u003ch3>Дебаг\u003c/h3>\n\u003cp>\u003ccode>COMBO 100%\u003c/code> → \u003ccode>EZ COMBO\u003c/code>: комбо за будь-який прохід повз шип у радіусі 145 (і з сусіднього кільця), іскру ловити не треба. \u003ccode>nearMin\u003c/code> / \u003ccode>nearMax\u003c/code> з рушія прибрано — їх більше немає.\u003c/p>\n\u003ch3>Перевірено\u003c/h3>\n\u003cul>\u003cli>\u003ccode>:engine:test\u003c/code> — \u003cstrong>13 із 13\u003c/strong>, з них п'ять нових: іскра лише в шипа й за 52 попереду; спіймано по дорозі до шипа, потім шип убиває; тап одразу після — живий із комбо; стрибок на кільце шипа рівно в іскру ловить її на лерпі радіуса; EZ COMBO зараховує сусіднє кільце, без прапорця — ні. Детермінізм (\u003ccode>sameSeedGivesSameRun\u003c/code>) не змінився — іскра не чіпає rng.\u003c/li>\u003cli>\u003ccode>assembleDebug\u003c/code> — \u003cstrong>BUILD SUCCESSFUL\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>На пристрої\u003c/strong> (Redmi 24117RN76E, лабораторний APK): іскра стоїть перед шипом по ходу м'яча, відстань до шипа 78 px = 52 юніти; 60 FPS, \u003ccode>draw 34\u003c/code> — як і без неї. Підбір: дебаг-шип на своєму кільці → м'яч проїхав крізь іскру → у HUD \u003ccode>COMBO x2\u003c/code>, іскра погасла → шип убив. Рахунок 26 = \u003ccode>t·12\u003c/code> + бонус 10, усе сходиться.\u003c/li>\u003cli>\u003cstrong>Розмір після правки\u003c/strong> — заміряно по знімку власним декодером PNG (нейтрально-білі пікселі, щоб не зловити жовтий гем): ядро 9.4 px = \u003cstrong>3.1 юніта\u003c/strong> в момент кадру, при стелі 4 і низу 2.96. До правки те саме ядро було 20 px = 6.7 юніта.\u003c/li>\u003cli>\u003cstrong>Напис\u003c/strong> — знайдено у 2 кадрах із 10 (решту з'їдає затримка \u003ccode>screencap\u003c/code>, напис живе 1.1 с): висота літер 28–29 px = 9 юнітів, тобто капітель від кегля 13. Стоїть у точці іскри.\u003c/li>\u003c/ul>\n\u003ch3>Не в цьому патчі\u003c/h3>\n\u003cp>Супутники навколо м'яча при комбо (\u003ccode>sats = min(4, mult−1)\u003c/code>, та сама графіка) і дуга таймера комбо навколо м'яча — окремим патчем, коли іскра на пристрої сподобається. \u003ccode>CLAUDE.md\u003c/code> (розділ «Комбо») і \u003ccode>docs/decisions.md\u003c/code> §8 уже оновив.\u003c/p>", "files": [{"path": "engine/src/main/kotlin/com/lewydo/orbitdash/engine/RunEngine.kt", "note": "Entity.orb, sparkAngle(), підбір і 00Z", "note": "вставлено"}}, "5.11": {"choice": "auto", "result": {"ok": true, "by": "claude", "at": "2026-09-18T11:44:00.000Z", "note": "вставлено"}}, "5.12": {"choice": "auto", "result": {"ok": true, "by": "claude", "at": "2026-09-18T11:44:00.000Z", "note": "вставлено"}}, "5.13": {"choice": "auto", "result": {"ok": true, "by": "claude", "at": "2026-09-18T11:44:00.000Z", "note": "вставлено"}}, "5.14": {"choice": "auto", "result": {"ok": true, "by": "claude", "at": "2026-09-18T11:44:00.000Z", "note": "вставлено"}}, "5.15": {"choice": "auto", "result": {"ok": true, "by": "claude", "at": "2026-09-18T11:44:00.000Z", "note": "вставлено"}}, "5.16": {"choice": "auto", "result": {"ok": true, "by": "claude", "at": "2026-09-18T11:44:00.000Z", "note": "вставлено"}}, "5.17": {"choice": "auto", "result": {"ok": true, "by": "claude", "at": "2026-09-18T11:44:00.000Z", "note": "вставлено"}}}, "result": {"ok": true, "at": "2026-09-18T11:44:00.000Z", "note": "усі 33 вставлено, :engine:test 13/13, assembleDebug зелений, APK на пристрої"}}}</script><script id="app">
(function () {
  "use strict";

  const data = JSON.parse(document.getElementById("patch-data").textContent);
  const state = data.state || (data.state = {});
  state.hunks = state.hunks || {};

  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };
  const fmtTime = (iso) => {
    try { return new Date(iso).toLocaleString("uk-UA", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }); }
    catch (e) { return iso || ""; }
  };

  const allHunks = [];
  data.files.forEach((f) => f.hunks.forEach((h) => allHunks.push(h)));

  const submitted = () => !!state.submitted;
  const hasResults = () => allHunks.some((h) => state.hunks[h.id] && state.hunks[h.id].result);

  // Чернетка вибору до «Готово» — лише в цьому браузері; не вдалось — не страшно
  const DRAFT_KEY = "patch-draft-" + data.id;
  function loadDraft() {
    if (submitted()) return;
    try {
      const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || "{}");
      Object.keys(d).forEach((id) => {
        if (allHunks.some((h) => h.id === id)) state.hunks[id] = { choice: d[id] };
      });
    } catch (e) { /* немає сховища */ }
  }
  function saveDraft() {
    try {
      const d = {};
      Object.keys(state.hunks).forEach((id) => { if (state.hunks[id].choice) d[id] = state.hunks[id].choice; });
      localStorage.setItem(DRAFT_KEY, JSON.stringify(d));
    } catch (e) { /* немає сховища */ }
  }

  // ── підсвітка: блок цілком (коментарі на кілька рядків), потім різання на рядки ──
  function highlight(text, lang) {
    const hl = window.hljs;
    if (!hl || !lang || !hl.getLanguage(lang)) return null;
    try { return hl.highlight(text, { language: lang, ignoreIllegals: true }).value; }
    catch (e) { return null; }
  }
  function splitHtmlLines(htmlText) {
    const lines = [];
    let cur = "";
    const open = [];
    const re = /(<span[^>]*>)|(<\/span>)|(\n)|([^<\n]+|<(?!\/?span)[^>]*>)/g;
    let m;
    while ((m = re.exec(htmlText))) {
      if (m[1]) { open.push(m[1]); cur += m[1]; }
      else if (m[2]) { open.pop(); cur += m[2]; }
      else if (m[3]) { cur += "</span>".repeat(open.length); lines.push(cur); cur = open.join(""); }
      else cur += m[4];
    }
    lines.push(cur);
    return lines;
  }
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", "");
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
      ta.remove();
      return ok;
    }
  }

  function codeBlock(kind, label, text, marks, lang) {
    const box = el("div", "code " + kind);
    const head = el("div", "code-label");
    head.appendChild(el("span", null, label));
    const btn = el("button", "copy", "Копіювати");
    btn.type = "button";
    btn.addEventListener("click", async () => {
      const ok = await copyText(text);
      btn.textContent = ok ? "Скопійовано" : "Не вдалось";
      setTimeout(() => { btn.textContent = "Копіювати"; }, 1600);
    });
    head.appendChild(btn);
    box.appendChild(head);

    const pre = el("pre");
    const code = el("code");
    const hl = highlight(text, lang);
    const lines = hl != null ? splitHtmlLines(hl) : text.split("\n").map(escapeHtml);
    code.innerHTML = lines.map((l, i) => {
      const cls = marks ? (marks[i] ? "ln chg" : "ln ctx") : "ln";
      return '<span class="' + cls + '">' + (l || "") + "</span>";
    }).join("");
    pre.appendChild(code);
    box.appendChild(pre);
    return box;
  }

  const VERB = { replace: "ЗАМІНИТИ", add: "ДОДАТИ", remove: "ВИДАЛИТИ", create: "НОВИЙ ФАЙЛ", delete: "ВИДАЛИТИ ФАЙЛ" };

  function hunkStatus(h) {
    const s = state.hunks[h.id];
    if (!s || !s.choice) return el("span", "pill new", "не обрано");
    if (s.result) {
      const p = el("span", "pill " + (s.result.ok ? "done" : "fail"), s.result.note || (s.result.ok ? "готово" : "не вийшло"));
      return p;
    }
    if (submitted()) return el("span", "pill pending", s.choice === "auto" ? "Claude вставляє" : "Claude перевіряє");
    return null;
  }

  function setChoice(id, choice) {
    if (submitted()) return;
    const s = state.hunks[id] || (state.hunks[id] = {});
    s.choice = s.choice === choice ? null : choice;
    saveDraft();
    render();
  }

  function renderPage() {
    const root = $("root");
    const scrollY = window.scrollY;
    root.textContent = "";

    const head = el("header", "head");
    const eyebrow = el("div", "eyebrow");
    eyebrow.appendChild(el("span", "num", "патч " + data.id));
    if (data.date) eyebrow.appendChild(el("span", null, data.date));
    head.appendChild(eyebrow);
    head.appendChild(el("h1", null, data.title));
    root.appendChild(head);

    // summaryHtml генерує Claude з власного .md — довірений вміст
    const summary = el("section", "summary");
    summary.innerHTML = data.summaryHtml || "";
    root.appendChild(summary);

    const steps = el("section", "steps");
    const t = el("div", "steps-title");
    t.appendChild(el("h2", null, "Зміни"));
    t.appendChild(el("p", null, (data.order ? data.order + " " : "") +
      "Біля кожної зміни обери, хто її вставляє, потім «Готово» внизу."));
    steps.appendChild(t);

    const locked = submitted();
    data.files.forEach((f, fi) => {
      const card = el("article", "file");
      const fh = el("div", "file-head");
      const fid = el("div", "file-id");
      fid.appendChild(el("span", "idx", String(fi + 1)));
      fid.appendChild(el("span", "path", f.path));
      fh.appendChild(fid);
      if (f.hunks.length > 1) {
        const all = el("div", "file-all");
        all.appendChild(el("span", null, "увесь файл:"));
        [["self", "сам"], ["auto", "авто"]].forEach(([c, label]) => {
          const b = el("button", "link", label);
          b.type = "button";
          b.disabled = locked;
          b.addEventListener("click", () => {
            f.hunks.forEach((h) => { (state.hunks[h.id] || (state.hunks[h.id] = {})).choice = c === "self" ? "manual" : "auto"; });
            saveDraft(); render();
          });
          all.appendChild(b);
        });
        fh.appendChild(all);
      }
      card.appendChild(fh);
      if (f.note) card.appendChild(el("p", "file-note", f.note));

      f.hunks.forEach((h) => {
        const hb = el("div", "hunk");
        const top = el("div", "hunk-top");
        const ht = el("div", "hunk-title");
        ht.appendChild(el("span", "hid", h.id));
        ht.appendChild(el("span", "verb " + h.verb, VERB[h.verb] || h.verb));
        if (h.where) ht.appendChild(el("span", "where", h.where));
        const st = hunkStatus(h);
        if (st && (locked || !state.hunks[h.id] || !state.hunks[h.id].choice)) ht.appendChild(st);
        top.appendChild(ht);

        const choice = el("div", "choice");
        choice.setAttribute("role", "group");
        choice.setAttribute("aria-label", "Хто вставляє зміну " + h.id);
        const cur = (state.hunks[h.id] || {}).choice;
        [["manual", "self", "Вставив сам"], ["auto", "auto", "Вставити автоматично"]].forEach(([val, cls, label]) => {
          const b = el("button", cls, label);
          b.type = "button";
          b.setAttribute("aria-pressed", String(cur === val));
          b.disabled = locked;
          b.addEventListener("click", () => setChoice(h.id, val));
          choice.appendChild(b);
        });
        top.appendChild(choice);
        hb.appendChild(top);

        const lang = h.lang || f.lang;
        if (h.old != null) hb.appendChild(codeBlock("old", h.verb === "add" ? "Знайти (вже є у файлі)" : "Було", h.old, h.oldMarks, lang));
        if (h.new != null) hb.appendChild(codeBlock("new", h.verb === "create" ? "Файл цілком" : "Стало", h.new, h.newMarks, lang));
        card.appendChild(hb);
      });
      steps.appendChild(card);
    });
    root.appendChild(steps);
    window.scrollTo(0, scrollY);
  }

  // ── панель ───────────────────────────────────────────────────────────
  let artifactApi = null;
  let busy = false;

  function counts() {
    let self = 0, auto = 0, none = 0;
    allHunks.forEach((h) => {
      const c = (state.hunks[h.id] || {}).choice;
      if (c === "manual") self++; else if (c === "auto") auto++; else none++;
    });
    return { self, auto, none };
  }

  function renderBar() {
    const status = $("status"), bulk = $("bulk"), send = $("send");
    status.textContent = ""; bulk.textContent = "";
    const c = counts();

    if (state.result) {
      status.appendChild(el("span", "pill " + (state.result.ok ? "done" : "fail"), state.result.ok ? "Готово" : "Є проблеми"));
      status.appendChild(el("span", null, fmtTime(state.result.at)));
      if (state.result.note) status.appendChild(el("span", "note", state.result.note));
      send.hidden = true;
      return;
    }

    const tally = el("span", "tally", "сам " + c.self + " · авто " + c.auto + (c.none ? " · не обрано " + c.none : ""));
    status.appendChild(tally);

    if (submitted()) {
      status.appendChild(el("span", "pill pending", "Надіслано"));
      status.appendChild(el("span", "note", fmtTime(state.submitted) + " — Claude вставить «авто», перевірить «сам» і збере проєкт"));
      send.hidden = hasResults();
      send.className = "send ghost";
      send.textContent = "Змінити вибір";
      send.disabled = !artifactApi || busy;
      return;
    }

    if (!artifactApi) status.appendChild(el("span", "note", "надіслати можна на claude.ai; інакше напиши в чат"));
    else if (c.none) status.appendChild(el("span", "note", "обери для кожної зміни"));

    bulk.appendChild(el("span", null, "усе одразу:"));
    [["manual", "усе сам"], ["auto", "усе автоматично"], [null, "очистити"]].forEach(([val, label]) => {
      const b = el("button", "link", label);
      b.type = "button";
      b.addEventListener("click", () => {
        allHunks.forEach((h) => { (state.hunks[h.id] || (state.hunks[h.id] = {})).choice = val; });
        saveDraft(); render();
      });
      bulk.appendChild(b);
    });

    send.hidden = false;
    send.className = "send";
    send.textContent = c.none ? "Готово — ще " + c.none + " без вибору" : "Готово — надіслати Claude";
    send.disabled = !artifactApi || busy || c.none > 0;
  }

  function render() { renderPage(); renderBar(); }

  // Документ = незмінні частини + новий стан; живий DOM не серіалізуємо
  const HEAD_EXTRA =
    '<link rel="preconnect" href="https://fonts.googleapis.com">' +
    '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>' +
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">' +
    '<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"><\/script>' +
    '<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/glsl.min.js"><\/script>';
  const BAR =
    '<div class="bar" id="bar"><div class="bar-inner">' +
    '<div class="status" id="status"></div><div class="bulk" id="bulk"></div>' +
    '<button class="send" id="send" type="button">Готово — надіслати Claude</button>' +
    '</div></div>';

  function buildDocument() {
    const style = document.getElementById("style").outerHTML;
    const app = document.getElementById("app").textContent;
    const json = JSON.stringify(data).replace(/</g, "\\u003c");
    return "<!doctype html><html lang=\"uk\"><head><meta charset=\"utf-8\">" +
      "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">" +
      "<title>" + document.title.replace(/</g, "&lt;") + "</title>" + HEAD_EXTRA + style +
      "</head><body><main class=\"page\" id=\"root\"></main>" + BAR +
      "<script id=\"patch-data\" type=\"application/json\">" + json + "<\/script>" +
      "<script id=\"app\">" + app + "<\/script></body></html>";
  }

  async function publish() {
    busy = true; renderBar();
    try {
      await artifactApi.publish(buildDocument());
      try { localStorage.removeItem(DRAFT_KEY); } catch (e) { /* немає сховища */ }
    } catch (e) {
      busy = false;
      const code = e && e.code;
      if (code === "conflict") return;
      state.submitted = null;
      render();
      $("status").appendChild(el("span", "note", code === "not_writer" || code === "not_granted"
        ? "у тебе немає права змінювати цю сторінку"
        : "не вдалось надіслати — напиши в чат"));
    }
  }

  $("send").addEventListener("click", () => {
    if (!artifactApi || busy) return;
    if (submitted()) {           // «Змінити вибір» — поки Claude не почав
      if (hasResults()) return;
      state.submitted = null;
    } else {
      if (counts().none > 0) return;
      state.submitted = new Date().toISOString();
    }
    publish();
  });

  loadDraft();
  render();

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then((api) => { artifactApi = api; renderBar(); })
      .catch(() => { artifactApi = null; renderBar(); });
  }
})();
</script></body></html>
