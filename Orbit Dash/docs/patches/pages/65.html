body {

</style></head><body><main class="page" id="root"></main><div class="bar" id="bar"><div class="bar-inner"><div class="status" id="status"></div><div class="bulk" id="bulk"></div><button class="send" id="send" type="button">Готово — надіслати Claude</button></div></div><script id="patch-data" type="application/json">{"id": "65", "title": "ARingProgress / RingProgressEffect — кільце в родину прогресів", "date": "21.09.2026", "order": "Спершу нові файли (1–3), потім посилання на них (4–8), видалення старих — наприкінці. Компілюється після 10.", "summaryHtml": "\u003ch3>Що і навіщо\u003c/h3>\n\u003cp>Патч 64 звів прогреси в родину: \u003ccode>ABarProgress\u003c/code> / \u003ccode>AMaskProgress\u003c/code>, \u003ccode>BarProgressEffect\u003c/code> / \u003ccode>MaskProgressEffect\u003c/code>, три теки \u003ccode>progress/\u003c/code>. Поза нею лишився \u003ccode>ProgressRingEffect\u003c/code> — ім'я в зворотному порядку, шейдер у \u003ccode>shader/orbit/\u003c/code> серед ігрової геометрії, актора-обгортки немає, тож \u003ccode>ABall\u003c/code> тримав чотири рядки «ефект збоку + голий \u003ccode>VfxImage\u003c/code>», а \u003ccode>AWave\u003c/code> діставав ефект через \u003ccode>effect as\u003c/code>. Це та сама асиметрія, яку виправляли патчі 62 (актор для смуги) і 63 (\u003ccode>fillAlpha\u003c/code>); 64 сам записав її як наступний дотик.\u003c/p>\n\u003cp>Тепер родина повна: \u003cstrong>\u003ccode>Ring\u003c/code> — математика по колу\u003c/strong>, поруч із \u003ccode>Bar\u003c/code> (математика по прямій) і \u003ccode>Mask\u003c/code> (форма картинкою).\u003c/p>\n\u003ch3>Що де опинилось\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>було\u003c/th>\u003cth>стало\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>ефект\u003c/td>\u003ctd>\u003ccode>effects/ProgressRingEffect.kt\u003c/code>\u003c/td>\u003ctd>\u003cstrong>\u003ccode>effects/base/progress/RingProgressEffect.kt\u003c/code>\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>шейдер\u003c/td>\u003ctd>\u003ccode>shader/orbit/progressRingFS.glsl\u003c/code>\u003c/td>\u003ctd>\u003cstrong>\u003ccode>shader/base/progress/ringProgressFS.glsl\u003c/code>\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>актор\u003c/td>\u003ctd>не було\u003c/td>\u003ctd>\u003cstrong>\u003ccode>actors/progress/ARingProgress.kt\u003c/code>\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>GLSL усередині не змінено жодним символом — це переїзд і перейменування, не правка математики.\u003c/p>\n\u003ch3>ARingProgress\u003c/h3>\n\u003cp>Копія структури \u003ccode>ABarProgress\u003c/code>: \u003ccode>VfxImage\u003c/code> + свій ефект, прокинуті \u003ccode>frac\u003c/code>, \u003ccode>radius\u003c/code>, \u003ccode>thickness\u003c/code>, \u003ccode>trackAlpha\u003c/code>, рідкісне — на \u003ccode>fx\u003c/code>. Дві особливості, яких немає у смуги, і обидві в шапці класу:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>межі актора — квад\u003c/strong>, а не кільце: шейдер малює всередині квада, тож той мусить умістити радіус + півтовщини + AA (\u003ccode>RING_QUAD = 100\u003c/code> в \u003ccode>ABall\u003c/code>, \u003ccode>QUAD = 72\u003c/code> в \u003ccode>AWave\u003c/code>);\u003c/li>\u003cli>\u003cstrong>\u003ccode>open\u003c/code>\u003c/strong> — \u003ccode>AWave\u003c/code> успадковує саме актора. Хвиля це те саме кільце з \u003ccode>frac = 1\u003c/code>, у якого радіус і товщина їдуть у часі, тож їй тепер не треба ні \u003ccode>effect as\u003c/code>, ні власного поля \u003ccode>fx\u003c/code>.\u003c/li>\u003c/ul>\n\u003cp>\u003ccode>ABall\u003c/code> після цього коротший на два рядки: два \u003ccode>ARingProgress\u003c/code> замість двох пар «ефект + \u003ccode>VfxImage\u003c/code>», а \u003ccode>keepScaled\u003c/code> і \u003ccode>setCombo()\u003c/code> звертаються до актора напряму. Колір і далі йде тінтом актора, не \u003ccode>ringColor\u003c/code>, — коментар про це лишився на місці.\u003c/p>\n\u003ch3>Чого патч НЕ чіпає\u003c/h3>\n\u003cp>\u003ccode>OrbitRingEffect\u003c/code> і \u003ccode>shader/orbit/orbitRingFS.glsl\u003c/code> лишаються де були: кільця поля — ігрова геометрія, а не будівельний блок UI, і прогресу в них немає. Це тепер прямо записано в \u003ccode>docs/progress.md\u003c/code>, щоб наступного разу не переносити за компанію.\u003c/p>\n\u003ch3>Документи\u003c/h3>\n\u003cp>\u003ccode>docs/progress.md\u003c/code> — новий розділ «ARingProgress — кільце», третій рядок у таблиці «Де що лежить», абзац-виняток у кінці \u003cstrong>видалено\u003c/strong> (виняток закінчився). \u003ccode>CLAUDE.md\u003c/code> — чотири згадки. \u003ccode>docs/decisions.md\u003c/code> — лише імена класів у двох рядках, рішення не переписано.\u003c/p>\n\u003cp>Заразом \u003ccode>docs/figma-workflow.md\u003c/code> — тека дизайн-SVG переїхала з \u003ccode>assets/design/\u003c/code> у корінь репозиторію (\u003ccode>design/\u003c/code>): це джерело дизайну, а не ассет гри. Чотири згадки старого шляху.\u003c/p>\n\u003cp>Записи патчів у \u003ccode>docs/patches/\u003c/code> не чіпані — історію не переписуємо.\u003c/p>\n\u003cp>Зібрано в лабораторії: \u003ccode>assembleDebug\u003c/code> — BUILD SUCCESSFUL, \u003ccode>:engine:test\u003c/code> — зелено.\u003c/p>", "files": [{"path": "app/src/main/java/com/lewydo/orbitdash/game/utils/vfx/effects/base/progress/RingProgressEffect.kt", "note": "НОВИЙ ФАЙЛ: клас перейменовано з ProgressRingEffect, новий пакет і новий шлях шейдера. Математика не змінена.", "lang": "kotlin", "hunks": [{"verb": "create", "where": "створити", "old": null, "new": "package com.lewydo.orbitdash.game.utils.vfx.effects.base.progress\n\nimport com.badlogic.gdx.graphics.Color\nimport com.badlogic.gdx.graphics.glutils.ShaderProgram\nimport com.lewydo.orbitdash.game.utils.vfx.VfxContext\nimport com.lewydo.orbitdash.game.utils.vfx.effects.base.VfxEffect\n\n// ─────────────────────────────────────────────────────────────────────────────\n// RingProgressEffect — кільце із заповненням (single-pass).\n//\n// Доріжка по всьому колу з альфою trackAlpha і заповнена дуга від 12-ї години\n// за годинниковою на frac оберту; frac = 1 — звичайне суцільне кільце. Так\n// малюються обидва кільця м'яча: таймер комбо (frac тане) і щит (frac = 1).\n//\n// Третій у родині прогресів, і ім'я каже, ЧИМ задана форма: Bar — математика\n// по прямій, Mask — картинка, Ring — математика по колу. Вибір між ними —\n// docs/progress.md.\n//\n// Розміри — у world-юнітах групи, у частки квада переводяться тут через\n// ctx.width, як в OrbitRingEffect. Радіус задається явно (макет), а без нього —\n// найбільший, що влазить у квад разом із товщиною й AA.\n// ─────────────────────────────────────────────────────────────────────────────\nclass RingProgressEffect : VfxEffect() {\n\n    override val fragmentShader = \"shader/base/progress/ringProgressFS.glsl\"\n\n    /** Радіус осі кільця у world-юнітах; null — найбільший, що влазить. */\n    var radius: Float? = null\n\n    /** Товщина кільця у world-юнітах. */\n    var thickness = 4f\n\n    /** Колір кільця. */\n    val color: Color = Color(1f, 1f, 1f, 1f)\n\n    /** Заповнення 0..1 від 12-ї години за годинниковою. */\n    var frac = 1f\n\n    /** Альфа незаповненої частини кільця. */\n    var trackAlpha = 0.25f\n\n    override fun setUniforms(shader: ShaderProgram, ctx: VfxContext) {\n        val invW = 1f / ctx.width\n        val aa   = 1.5f                                           // згладжування, world\n\n        // Без явного радіуса зовнішня грань — на aa всередину від межі квада,\n        // інакше фейд зрізається\n        val r = radius ?: ((minOf(ctx.width, ctx.height) - thickness) * 0.5f - aa)\n\n        shader.setUniformf(\"u_hOverW\", ctx.height / ctx.width)\n        shader.setUniformf(\"u_radius\", r * invW)\n        shader.setUniformf(\"u_width\",  thickness * invW)\n        shader.setUniformf(\"u_aa\",     aa * invW)\n        shader.setUniformf(\"u_color\",  color.r, color.g, color.b)\n        shader.setUniformf(\"u_frac\",   frac.coerceIn(0f, 1f))\n        shader.setUniformf(\"u_trackA\", trackAlpha)\n    }\n\n    override fun stateKey(): Long {\n        var k = 23L\n        k = k * 31 + (radius ?: -1f).toRawBits()\n        k = k * 31 + thickness.toRawBits()\n        k = k * 31 + color.toIntBits().toLong()\n        k = k * 31 + frac.toRawBits()\n        k = k * 31 + trackAlpha.toRawBits()\n        return k\n    }\n}", "id": "1.1"}]}, {"path": "app/src/main/assets/shader/base/progress/ringProgressFS.glsl", "note": "НОВИЙ ФАЙЛ (був shader/orbit/progressRingFS.glsl). GLSL один в один, змінено лише заголовок-коментар.", "lang": "glsl", "hunks": [{"verb": "create", "where": "створити", "old": null, "new": "#ifdef GL_ES\n#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif\n#endif\n\n// ─────────────────────────────────────────────────────────────────────────────\n// RING PROGRESS — кільце із заповненням, один прохід (таймер комбо, щит).\n//\n// Доріжка (u_trackA) по всьому колу і заповнена дуга від 12-ї години за\n// годинниковою на u_frac оберту; u_frac = 1 — суцільне кільце. Колір один, тож\n// компонувати шари не треба: альфа — або доріжка, або повна. Усі довжини — у частках\n// ширини квада, як в orbitRingFS.\n//\n// Круговий двійник barProgressFS: та сама доріжка + заповнення, лише по колу.\n// ─────────────────────────────────────────────────────────────────────────────\n\nvarying vec4 v_color;      // колір/альфа актора (фейди груп працюють самі)\nvarying vec2 v_localUV;    // 0..1 у межах регіону (дає BATCH_VERT)\n\nuniform float u_hOverW;    // height/width квада — аспект-корекція\nuniform float u_radius;    // радіус осі кільця\nuniform float u_width;     // товщина кільця\nuniform float u_aa;        // згладжування країв\nuniform vec3  u_color;     // колір кільця\nuniform float u_frac;      // заповнення 0..1 від 12-ї години за годинниковою\nuniform float u_trackA;    // альфа незаповненої частини\n\nconst float TWO_PI = 6.2831853;\n\n/** Покриття обводки товщиною w на відстані d від її осі (як в orbitRingFS). */\nfloat stroke(float d, float w) {\n    float halfW = w * 0.5;\n    return 1.0 - smoothstep(halfW - u_aa * 0.5, halfW + u_aa * 0.5, d);\n}\n\nvoid main() {\n    vec2 p = v_localUV - vec2(0.5);\n    p.y *= u_hOverW;\n\n    float ring = stroke(abs(length(p) - u_radius), u_width);\n\n    // Частка оберту від 12-ї години ЗА годинниковою. v_localUV — UV текстури,\n    // Y у нього вниз: (0,−1) — верх. atan(x, −y): верх → 0, правий бік → +¼.\n    float t = fract(atan(p.x, -p.y) / TWO_PI);\n\n    // Кінець дуги згладжений по дузі тією ж шириною u_aa, що й краї кільця\n    float e    = u_aa / (TWO_PI * max(u_radius, 1e-4));\n    float fill = 1.0 - smoothstep(u_frac - e, u_frac + e, t);\n    fill = max(fill, step(1.0, u_frac));   // повне — без шва на 12-й\n    fill *= step(1e-4, u_frac);            // нуль — сама доріжка\n\n    float a = ring * mix(u_trackA, 1.0, fill);\n    gl_FragColor = vec4(u_color, a) * v_color;\n}", "id": "2.1"}]}, {"path": "app/src/main/java/com/lewydo/orbitdash/game/actors/progress/ARingProgress.kt", "note": "НОВИЙ ФАЙЛ: актор-обгортка, пара до ABarProgress. open — бо AWave його успадковує.", "lang": "kotlin", "hunks": [{"verb": "create", "where": "створити", "old": null, "new": "package com.lewydo.orbitdash.game.actors.progress\n\nimport com.badlogic.gdx.scenes.scene2d.utils.TextureRegionDrawable\nimport com.lewydo.orbitdash.game.utils.advanced.AdvancedScreen\nimport com.lewydo.orbitdash.game.utils.vfx.VfxImage\nimport com.lewydo.orbitdash.game.utils.vfx.effects.base.progress.RingProgressEffect\n\n// ─────────────────────────────────────────────────────────────────────────────\n// ARingProgress — кільце прогресу як готовий актор.\n//\n//   val ring = ARingProgress(screen).apply {\n//       trackAlpha = 0.25f\n//       thickness  = 4f\n//   }\n//   ring.setSize(RING_QUAD, RING_QUAD)    // КВАД, не діаметр кільця\n//   ...\n//   ring.frac = engine.comboFrac          // єдине, що рухається\n//\n// Заповнення йде від 12-ї години за годинниковою; frac = 1 — суцільне кільце\n// (так зроблено кільце щита й хвиля спалаху).\n//\n// МЕЖІ АКТОРА — КВАД, А НЕ КІЛЬЦЕ. Шейдер малює всередині квада, тому той\n// мусить умістити радіус + півтовщини + AA: RING_QUAD у ABall, QUAD у AWave.\n// Це та сама модель «межі = фігура», лише фігура тут — саме квад із кільцем\n// усередині, а радіус задається окремо в world-юнітах.\n//\n// Третій у родині: ABarProgress — форма МАТЕМАТИЧНА по прямій, AMaskProgress —\n// КАРТИНКОЮ, тут — МАТЕМАТИЧНА по колу. Вибір — docs/progress.md.\n//\n// open, бо AWave успадковує актора, а не тримає ефект збоку: хвиля — те саме\n// кільце з frac = 1, у якого радіус і товщина їдуть у часі.\n// ─────────────────────────────────────────────────────────────────────────────\nopen class ARingProgress(override val screen: AdvancedScreen) : VfxImage(screen) {\n\n    /** Налаштування ефекту. Усе часте прокинуте полями нижче. */\n    val fx = RingProgressEffect()\n\n    init {\n        drawable = TextureRegionDrawable(screen.drawerUtil.getRegion())\n        effect   = fx\n    }\n\n    /** Заповнення 0..1 від 12-ї години за годинниковою. */\n    var frac: Float\n        get()      = fx.frac\n        set(value) { fx.frac = value }\n\n    /** Радіус осі кільця у world-юнітах; null — найбільший, що влазить у квад. */\n    var radius: Float?\n        get()      = fx.radius\n        set(value) { fx.radius = value }\n\n    /** Товщина кільця у world-юнітах. */\n    var thickness: Float\n        get()      = fx.thickness\n        set(value) { fx.thickness = value }\n\n    /** Альфа незаповненої частини. 0 — доріжки немає. */\n    var trackAlpha: Float\n        get()      = fx.trackAlpha\n        set(value) { fx.trackAlpha = value }\n\n    /**\n     * Колір кільця в шейдері. Зазвичай не потрібен: тінт самого актора\n     * (setColorRGB) фарбує і кільце, і доріжку разом — саме так робить ABall.\n     */\n    val ringColor get() = fx.color\n}", "id": "3.1"}]}, {"path": "app/src/main/java/com/lewydo/orbitdash/game/actors/objects/ABall.kt", "note": "Два кільця на новому акторі: імпорти, секція Actors, keepScaled, setCombo, шапка.", "lang": "kotlin", "hunks": [{"verb": "add", "where": "біля рядка 5", "old": "import com.badlogic.gdx.utils.Align\nimport com.lewydo.orbitdash.game.actors.layout.constraintLayout.AConstraintLayout\nimport com.lewydo.orbitdash.engine.RunEngine.Boost\nimport com.lewydo.orbitdash.game.content.info", "new": "import com.badlogic.gdx.utils.Align\nimport com.lewydo.orbitdash.game.actors.layout.constraintLayout.AConstraintLayout\nimport com.lewydo.orbitdash.game.actors.progress.ARingProgress\nimport com.lewydo.orbitdash.engine.RunEngine.Boost\nimport com.lewydo.orbitdash.game.content.info", "oldMarks": [0, 0, 0, 0], "newMarks": [0, 0, 1, 0, 0], "id": "4.1"}, {"verb": "remove", "where": "біля рядка 14", "old": "import com.lewydo.orbitdash.game.utils.theme.ThemeManager\nimport com.lewydo.orbitdash.game.utils.theme.ThemeSync\nimport com.lewydo.orbitdash.game.utils.vfx.VfxImage\nimport com.lewydo.orbitdash.game.utils.vfx.effects.ProgressRingEffect\n\n// ─────────────────────────────────────────────────────────────────────────────", "new": "import com.lewydo.orbitdash.game.utils.theme.ThemeManager\nimport com.lewydo.orbitdash.game.utils.theme.ThemeSync\n\n// ─────────────────────────────────────────────────────────────────────────────", "oldMarks": [0, 0, 1, 1, 0, 0], "newMarks": [0, 0, 0, 0], "id": "4.2"}, {"verb": "replace", "where": "біля рядка 33", "old": "//  комбо завжди починається з 12-ї, а супутники крутяться своїм темпом.\n//\n//  Кільця — один шейдер ProgressRingEffect: комбо тане від 12-ї за\n//  годинниковою, щит — те саме кільце з frac = 1. Супутники — та сама графіка,\n//  що іскра на полі: гравець читає «спіймані іскри стали моїми».", "new": "//  комбо завжди починається з 12-ї, а супутники крутяться своїм темпом.\n//\n//  Кільця — два ARingProg     const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };
  const fmtTime = (iso) => {
    try { return new Date(iso).toLocaleString("uk-UA", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }); }
    catch (e) { return iso || ""; }
  };

  const allHunks = [];
  data.files.forEach((f) => f.hunks.forEach((h) => allHunks.push(h)));

  const submitted = () => !!state.submitted;
  const hasResults = () => allHunks.some((h) => state.hunks[h.id] && state.hunks[h.id].result);

  // Чернетка вибору до «Готово» — лише в цьому браузері; не вдалось — не страшно
  const DRAFT_KEY = "patch-draft-" + data.id;
  function loadDraft() {
    if (submitted()) return;
    try {
      const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || "{}");
      Object.keys(d).forEach((id) => {
        if (allHunks.some((h) => h.id === id)) state.hunks[id] = { choice: d[id] };
      });
    } catch (e) { /* немає сховища */ }
  }
  function saveDraft() {
    try {
      const d = {};
      Object.keys(state.hunks).forEach((id) => { if (state.hunks[id].choice) d[id] = state.hunks[id].choice; });
      localStorage.setItem(DRAFT_KEY, JSON.stringify(d));
    } catch (e) { /* немає сховища */ }
  }

  // ── підсвітка: блок цілком (коментарі на кілька рядків), потім різання на рядки ──
  function highlight(text, lang) {
    const hl = window.hljs;
    if (!hl || !lang || !hl.getLanguage(lang)) return null;
    try { return hl.highlight(text, { language: lang, ignoreIllegals: true }).value; }
    catch (e) { return null; }
  }
  function splitHtmlLines(htmlText) {
    const lines = [];
    let cur = "";
    const open = [];
    const re = /(<span[^>]*>)|(<\/span>)|(\n)|([^<\n]+|<(?!\/?span)[^>]*>)/g;
    let m;
    while ((m = re.exec(htmlText))) {
      if (m[1]) { open.push(m[1]); cur += m[1]; }
      else if (m[2]) { open.pop(); cur += m[2]; }
      else if (m[3]) { cur += "</span>".repeat(open.length); lines.push(cur); cur = open.join(""); }
      else cur += m[4];
    }
    lines.push(cur);
    return lines;
  }
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", "");
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
      ta.remove();
      return ok;
    }
  }

  function codeBlock(kind, label, text, marks, lang) {
    const box = el("div", "code " + kind);
    const head = el("div", "code-label");
    head.appendChild(el("span", null, label));
    const btn = el("button", "copy", "Копіювати");
    btn.type = "button";
    btn.addEventListener("click", async () => {
      const ok = await copyText(text);
      btn.textContent = ok ? "Скопійовано" : "Не вдалось";
      setTimeout(() => { btn.textContent = "Копіювати"; }, 1600);
    });
    head.appendChild(btn);
    box.appendChild(head);

    const pre = el("pre");
    const code = el("code");
    const hl = highlight(text, lang);
    const lines = hl != null ? splitHtmlLines(hl) : text.split("\n").map(escapeHtml);
    code.innerHTML = lines.map((l, i) => {
      const cls = marks ? (marks[i] ? "ln chg" : "ln ctx") : "ln";
      return '<span class="' + cls + '">' + (l || "") + "</span>";
    }).join("");
    pre.appendChild(code);
    box.appendChild(pre);
    return box;
  }

  const VERB = { replace: "ЗАМІНИТИ", add: "ДОДАТИ", remove: "ВИДАЛИТИ", create: "НОВИЙ ФАЙЛ", delete: "ВИДАЛИТИ ФАЙЛ" };

  function hunkStatus(h) {
    const s = state.hunks[h.id];
    if (!s || !s.choice) return el("span", "pill new", "не обрано");
    if (s.result) {
      const p = el("span", "pill " + (s.result.ok ? "done" : "fail"), s.result.note || (s.result.ok ? "готово" : "не вийшло"));
      return p;
    }
    if (submitted()) return el("span", "pill pending", s.choice === "auto" ? "Claude вставляє" : "Claude перевіряє");
    return null;
  }

  function setChoice(id, choice) {
    if (submitted()) return;
    const s = state.hunks[id] || (state.hunks[id] = {});
    s.choice = s.choice === choice ? null : choice;
    saveDraft();
    render();
  }

  function renderPage() {
    const root = $("root");
    const scrollY = window.scrollY;
    root.textContent = "";

    const head = el("header", "head");
    const eyebrow = el("div", "eyebrow");
    eyebrow.appendChild(el("span", "num", "патч " + data.id));
    if (data.date) eyebrow.appendChild(el("span", null, data.date));
    head.appendChild(eyebrow);
    head.appendChild(el("h1", null, data.title));
    root.appendChild(head);

    // summaryHtml генерує Claude з власного .md — довірений вміст
    const summary = el("section", "summary");
    summary.innerHTML = data.summaryHtml || "";
    root.appendChild(summary);

    const steps = el("section", "steps");
    const t = el("div", "steps-title");
    t.appendChild(el("h2", null, "Зміни"));
    t.appendChild(el("p", null, (data.order ? data.order + " " : "") +
      "Біля кожної зміни обери, хто її вставляє, потім «Готово» внизу."));
    steps.appendChild(t);

    const locked = submitted();
    data.files.forEach((f, fi) => {
      const card = el("article", "file");
      const fh = el("div", "file-head");
      const fid = el("div", "file-id");
      fid.appendChild(el("span", "idx", String(fi + 1)));
      fid.appendChild(el("span", "path", f.path));
      fh.appendChild(fid);
      if (f.hunks.length > 1) {
        const all = el("div", "file-all");
        all.appendChild(el("span", null, "увесь файл:"));
        [["self", "сам"], ["auto", "авто"]].forEach(([c, label]) => {
          const b = el("button", "link", label);
          b.type = "button";
          b.disabled = locked;
          b.addEventListener("click", () => {
            f.hunks.forEach((h) => { (state.hunks[h.id] || (state.hunks[h.id] = {})).choice = c === "self" ? "manual" : "auto"; });
            saveDraft(); render();
          });
          all.appendChild(b);
        });
        fh.appendChild(all);
      }
      card.appendChild(fh);
      if (f.note) card.appendChild(el("p", "file-note", f.note));

      f.hunks.forEach((h) => {
        const hb = el("div", "hunk");
        const top = el("div", "hunk-top");
        const ht = el("div", "hunk-title");
        ht.appendChild(el("span", "hid", h.id));
        ht.appendChild(el("span", "verb " + h.verb, VERB[h.verb] || h.verb));
        if (h.where) ht.appendChild(el("span", "where", h.where));
        const st = hunkStatus(h);
        if (st && (locked || !state.hunks[h.id] || !state.hunks[h.id].choice)) ht.appendChild(st);
        top.appendChild(ht);

        const choice = el("div", "choice");
        choice.setAttribute("role", "group");
        choice.setAttribute("aria-label", "Хто вставляє зміну " + h.id);
        const cur = (state.hunks[h.id] || {}).choice;
        [["manual", "self", "Вставив сам"], ["auto", "auto", "Вставити автоматично"]].forEach(([val, cls, label]) => {
          const b = el("button", cls, label);
          b.type = "button";
          b.setAttribute("aria-pressed", String(cur === val));
          b.disabled = locked;
          b.addEventListener("click", () => setChoice(h.id, val));
          choice.appendChild(b);
        });
        top.appendChild(choice);
        hb.appendChild(top);

        const lang = h.lang || f.lang;
        if (h.old != null) hb.appendChild(codeBlock("old", h.verb === "add" ? "Знайти (вже є у файлі)" : "Було", h.old, h.oldMarks, lang));
        if (h.new != null) hb.appendChild(codeBlock("new", h.verb === "create" ? "Файл цілком" : "Стало", h.new, h.newMarks, lang));
        card.appendChild(hb);
      });
      steps.appendChild(card);
    });
    root.appendChild(steps);
    window.scrollTo(0, scrollY);
  }

  // ── панель ───────────────────────────────────────────────────────────
  let artifactApi = null;
  let busy = false;

  function counts() {
    let self = 0, auto = 0, none = 0;
    allHunks.forEach((h) => {
      const c = (state.hunks[h.id] || {}).choice;
      if (c === "manual") self++; else if (c === "auto") auto++; else none++;
    });
    return { self, auto, none };
  }

  function renderBar() {
    const status = $("status"), bulk = $("bulk"), send = $("send");
    status.textContent = ""; bulk.textContent = "";
    const c = counts();

    if (state.result) {
      status.appendChild(el("span", "pill " + (state.result.ok ? "done" : "fail"), state.result.ok ? "Готово" : "Є проблеми"));
      status.appendChild(el("span", null, fmtTime(state.result.at)));
      if (state.result.note) status.appendChild(el("span", "note", state.result.note));
      send.hidden = true;
      return;
    }

    const tally = el("span", "tally", "сам " + c.self + " · авто " + c.auto + (c.none ? " · не обрано " + c.none : ""));
    status.appendChild(tally);

    if (submitted()) {
      status.appendChild(el("span", "pill pending", "Надіслано"));
      status.appendChild(el("span", "note", fmtTime(state.submitted) + " — Claude вставить «авто», перевірить «сам» і збере проєкт"));
      send.hidden = hasResults();
      send.className = "send ghost";
      send.textContent = "Змінити вибір";
      send.disabled = !artifactApi || busy;
      return;
    }

    if (!artifactApi) status.appendChild(el("span", "note", "надіслати можна на claude.ai; інакше напиши в чат"));
    else if (c.none) status.appendChild(el("span", "note", "обери для кожної зміни"));

    bulk.appendChild(el("span", null, "усе одразу:"));
    [["manual", "усе сам"], ["auto", "усе автоматично"], [null, "очистити"]].forEach(([val, label]) => {
      const b = el("button", "link", label);
      b.type = "button";
      b.addEventListener("click", () => {
        allHunks.forEach((h) => { (state.hunks[h.id] || (state.hunks[h.id] = {})).choice = val; });
        saveDraft(); render();
      });
      bulk.appendChild(b);
    });

    send.hidden = false;
    send.className = "send";
    send.textContent = c.none ? "Готово — ще " + c.none + " без вибору" : "Готово — надіслати Claude";
    send.disabled = !artifactApi || busy || c.none > 0;
  }

  function render() { renderPage(); renderBar(); }

  // Документ = незмінні частини + новий стан; живий DOM не серіалізуємо
  const HEAD_EXTRA =
    '<link rel="preconnect" href="https://fonts.googleapis.com">' +
    '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>' +
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">' +
    '<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"><\/script>' +
    '<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/glsl.min.js"><\/script>';
  const BAR =
    '<div class="bar" id="bar"><div class="bar-inner">' +
    '<div class="status" id="status"></div><div class="bulk" id="bulk"></div>' +
    '<button class="send" id="send" type="button">Готово — надіслати Claude</button>' +
    '</div></div>';

  function buildDocument() {
    const style = document.getElementById("style").outerHTML;
    const app = document.getElementById("app").textContent;
    const json = JSON.stringify(data).replace(/</g, "\\u003c");
    return "<!doctype html><html lang=\"uk\"><head><meta charset=\"utf-8\">" +
      "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">" +
      "<title>" + document.title.replace(/</g, "&lt;") + "</title>" + HEAD_EXTRA + style +
      "</head><body><main class=\"page\" id=\"root\"></main>" + BAR +
      "<script id=\"patch-data\" type=\"application/json\">" + json + "<\/script>" +
      "<script id=\"app\">" + app + "<\/script></body></html>";
  }

  async function publish() {
    busy = true; renderBar();
    try {
      await artifactApi.publish(buildDocument());
      try { localStorage.removeItem(DRAFT_KEY); } catch (e) { /* немає сховища */ }
    } catch (e) {
      busy = false;
      const code = e && e.code;
      if (code === "conflict") return;
      state.submitted = null;
      render();
      $("status").appendChild(el("span", "note", code === "not_writer" || code === "not_granted"
        ? "у тебе немає права змінювати цю сторінку"
        : "не вдалось надіслати — напиши в чат"));
    }
  }

  $("send").addEventListener("click", () => {
    if (!artifactApi || busy) return;
    if (submitted()) {           // «Змінити вибір» — поки Claude не почав
      if (hasResults()) return;
      state.submitted = null;
    } else {
      if (counts().none > 0) return;
      state.submitted = new Date().toISOString();
    }
    publish();
  });

  loadDraft();
  render();

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then((api) => { artifactApi = api; renderBar(); })
      .catch(() => { artifactApi = null; renderBar(); });
  }
})();
</script></body></html>
