<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Патч 51 · Стани м'яча</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"><script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/glsl.min.js"></script><style id="style">

* { box-sizing: border-box; }
body {
  background: var(--ground);
  color: var(--text);
  font: 15px/1.6 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
.page { max-width: 880px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 190px; }
h1, h2, h3 { font-family: "IBM Plex Sans", system-ui, sans-serif; letter-spacing: -.01em; text-wrap: balance; line-height: 1.25; margin: 0; }
h1 { font-size: 26px; font-weight: 700; }
h2 { font-size: 19px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 600; }
code, pre { font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace; }
:not(pre) > code {
  font-size: .88em; background: var(--sunk); border: 1px solid var(--line);
  border-radius: 4px; padding: 0 4px; overflow-wrap: anywhere;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; }

/* ── шапка ─────────────────────────────────────────── */
.head { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.num { font-family: "JetBrains Mono", monospace; font-weight: 500; letter-spacing: 0; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; }

.pill {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  font-size: 12px; font-weight: 600; letter-spacing: .03em; border-radius: 999px; padding: 2px 10px;
}
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.new     { color: var(--muted); background: var(--sunk); border: 1px solid var(--line); }
.pill.pending { color: var(--gem);   background: var(--gem-bg); }
.pill.done    { color: var(--good);  background: var(--good-bg); }
.pill.fail    { color: var(--spike); background: var(--spike-bg); }

/* ── пояснення ─────────────────────────────────────── */
.summary { max-width: 68ch; }
.summary > * + * { margin-top: 12px; }
.summary h3 { margin-top: 22px; }
.summary ul { padding-left: 20px; margin-block: 8px; }
.summary li + li { margin-top: 4px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
.summary table { border-collapse: collapse; width: 100%; font-size: 14px; }
.summary th, .summary td { text-align: left; vertical-align: top; padding: 7px 10px; border-bottom: 1px solid var(--line); }
.summary tr:last-child td { border-bottom: 0; }
.summary th { font-weight: 600; background: var(--sunk); }

/* ── кроки ─────────────────────────────────────────── */
.steps { display: flex; flex-direction: column; gap: 26px; margin-top: 30px; }
.steps-title { display: flex; flex-direction: column; gap: 4px; }
.steps-title p { margin: 0; color: var(--muted); font-size: 13px; }
.file { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.file-head {
  display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; justify-content: space-between;
  padding: 10px 14px; background: var(--sunk); border-bottom: 1px solid var(--line);
}
.file-id { display: flex; gap: 10px; align-items: baseline; min-width: 0; }
.file-id .idx { font-family: "JetBrains Mono", monospace; color: var(--muted); font-weight: 500; flex: none; }
.file-id .path { font-family: "JetBrains Mono", monospace; font-size: 13px; overflow-wrap: anywhere; }
.file-all { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.link {
  background: none; border: 0; padding: 0; cursor: pointer; color: var(--accent);
  text-decoration: underline; text-underline-offset: 2px; font-size: 12px;
}
.link:disabled { color: var(--faint); cursor: default; text-decoration: none; }
.file-note { padding: 10px 14px 0; margin: 0; color: var(--muted); font-size: 13px; }

.hunk { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.hunk + .hunk { border-top: 1px dashed var(--line); }
.hunk-top { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.hunk-title { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; font-size: 13px; }
.hid { font-family: "JetBrains Mono", monospace; color: var(--muted); }
.verb { font-weight: 600; letter-spacing: .06em; font-size: 12px; }
.verb.replace { color: var(--gem); }
.verb.add, .verb.create { color: var(--good); }
.verb.remove, .verb.delete { color: var(--spike); }
.where { color: var(--muted); }

/* вибір на зміну */
.choice { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.choice button {
  background: var(--surface); color: var(--muted); border: 0; padding: 7px 11px; cursor: pointer;
  font-family: "IBM Plex Sans", system-ui, sans-serif; font-weight: 600; font-size: 12.5px;
}
.choice button + button { border-left: 1px solid var(--line); }
.choice button[aria-pressed="true"].self { background: var(--text); color: var(--surface); }
.choice button[aria-pressed="true"].auto { background: var(--accent); color: var(--accent-ink); }
.choice button:disabled { cursor: default; }
.choice button:disabled:not([aria-pressed="true"]) { opacity: .45; }

/* код */
.code { border-radius: 8px; border: 1px solid var(--line); overflow: hidden; }
.code-label {

  font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 4px 6px 4px 10px;
}
.code-label { color: var(--muted); background: var(--surface); border-bottom: 1px solid var(--line); }
.code.old .code-label span:first-child::before { content: "● "; color: var(--spike); }
.code.new .code-label span:first-child::before { content: "● "; color: var(--good); }
.code pre {
  margin: 0; padding: 8px 0; overflow-x: auto; background: var(--sunk);
  font-size: 12.5px; line-height: 1.6; tab-size: 4;
}
.ln { display: block; white-space: pre; padding-right: 14px; min-height: 1.6em; }
.ln::before { content: " "; display: inline-block; width: 26px; text-align: center; color: var(--faint); user-select: none; }
.ln.ctx { opacity: .6; }
.code.old .ln.chg { background: var(--spike-bg); }
.code.old .ln.chg::before { content: "−"; color: var(--spike); }
.code.new .ln.chg { background: var(--good-bg); }
.code.new .ln.chg::before { content: "+"; color: var(--good); }
.copy {
  font: 500 11px/1 "IBM Plex Sans", system-ui, sans-serif; letter-spacing: .04em;
  color: inherit; background: transparent; border: 1px solid currentColor; border-radius: 6px;
  padding: 4px 8px; cursor: pointer;
}

.hljs-keyword, .hljs-built_in, .hljs-literal { color: var(--syn-kw); }
.hljs-type, .hljs-title.class_, .hljs-class .hljs-title { color: var(--syn-type); }
.hljs-title, .hljs-title.function_, .hljs-function .hljs-title { color: var(--syn-fn); }
.hljs-string, .hljs-char { color: var(--syn-str); }
.hljs-number { color: var(--syn-num); }
.hljs-comment, .hljs-doctag, .hljs-quote { color: var(--syn-com); font-style: italic; }
.hljs-meta, .hljs-annotation, .hljs-variable, .hljs-template-variable { color: var(--syn-meta); }

/* ── панель ────────────────────────────────────────── */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--surface); border-top: 1px solid var(--line); box-shadow: var(--shadow);
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
}
.bar-inner { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.status { font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.status .note { color: var(--muted); }
.tally { font-variant-numeric: tabular-nums; }
.bulk { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); align-items: center; }
.bulk .link { font-size: 13px; }
.send {
  font: 600 15px/1.2 "IBM Plex Sans", system-ui, sans-serif;
  border-radius: 12px; padding: 14px 12px; cursor: pointer; border: 2px solid var(--accent);
  background: var(--accent); color: var(--accent-ink); width: 100%;
}
.send.ghost { background: transparent; color: var(--accent); }
.send:disabled { opacity: .45; cursor: not-allowed; }
@media (max-width: 420px) { h1 { font-size: 22px; } .choice button { padding: 7px 8px; } }
@media (prefers-reduced-motion: no-preference) {
  .send, .choice button { transition: transform .08s ease, background-color .12s ease; }
  .send:active:not(:disabled) { transform: scale(.98); }
}
</style></head><body><main class="page" id="root"></main><div class="bar" id="bar"><div class="bar-inner"><div class="status" id="status"></div><div class="bulk" id="bulk"></div><button class="send" id="send" type="button">Готово — надіслати Claude</button></div></div><script id="patch-data" type="application/json">{"id": "51", "title": "Стани м'яча в ABall: кільце-таймер комбо, супутники, кільце щита", "date": "18.09.2026", "order": "Файли 1 → 6. Рушій і тести разом, потім шейдер, ефект, ABall, GameScreen.", "summaryHtml": "\u003ch3>Що і навіщо\u003c/h3>\n\u003cp>Комбо є, а над м'ячем його не видно: ні скільки лишилось часу, ні який множник. Прототип і твій Figma показують обидва — кільце-таймер і супутники, плюс кільце щита. Переношу \u003cstrong>один в один зі свого SVG\u003c/strong> (\u003ccode>BALL + COMBO\u003c/code>, \u003ccode>ball + shield + combo\u003c/code>).\u003c/p>\n\u003ch3>Усе — в ABall, одним актором\u003c/h3>\n\u003cp>Перша версія цього патча робила окремий \u003ccode>AComboHalo\u003c/code> у тій самій точці, що й м'яч. Ти спитав «а чому не в ABall» — і мав рацію. Окремий актор був обходом того, що \u003ccode>GameScreen\u003c/code> крутить \u003cstrong>усю групу\u003c/strong> м'яча, щоб цятка вказувала напрям, — а обертати групу заради однієї цятки й було помилкою: цятку можна ставити по колу через \u003ccode>cos/sin\u003c/code>, як \u003ccode>ctx.rotate\u003c/code> у прототипі. Тепер \u003ccode>ABall.heading\u003c/code> крутить лише її, група не обертається — а це була \u003cstrong>єдина transform-група серед об'єктів поля\u003c/strong> (\u003ccode>AGem\u003c/code> / \u003ccode>ASpike\u003c/code> крутять дитину-\u003ccode>Image\u003c/code>), тобто мінус два флаші батча на кадр. Кільця й супутники — звичайні діти \u003ccode>ABall\u003c/code>, і \u003ccode>GameScreen\u003c/code> віддає м'ячу стан трьома рядками.\u003c/p>\n\u003cp>\u003cstrong>Цятка виглядає так само, як була.\u003c/strong> Старий \u003ccode>rotation = −angle\u003c/code> переносив її з 135° на \u003ccode>135° − angle\u003c/code>; \u003ccode>heading = −angle\u003c/code> дає рівно ту ж формулу: один оберт цятки на оберт по орбіті, зчеплено з рухом — м'яч «повертається разом з орбітою», як \u003ccode>ctx.rotate(st.angle)\u003c/code> у прототипі. Множник \u003ccode>POINT_SPIN = 1\u003c/code> тримає це рішення в коді: ~9.5 (r кільця / r м'яча) котило б м'яч колесом, але на 100–300°/с це мерехтіння. Записано в \u003ccode>docs/decisions.md\u003c/code> §8, разом із двома іншими варіантами, які ти назвав, і чому вони гірші.\u003c/p>\n\u003ch3>Розміри — з SVG, база 40 = діаметр м'яча\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>шар\u003c/th>\u003cth>Figma\u003c/th>\u003cth>у коді\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>ореол м'яча\u003c/td>\u003ctd>диск r 23.8 + blur σ 11\u003c/td>\u003ctd>\u003ccode>GLOW_SIZE 100\u003c/code> — уже було: 47.6 × 84/40\u003c/td>\u003c/tr>\u003ctr>\u003ctd>цятка напряму\u003c/td>\u003ctd>r 5 на (−5, −5)\u003c/td>\u003ctd>\u003ccode>POINT_R 7.07\u003c/code> під 135° + \u003ccode>heading\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>кільце щита\u003c/td>\u003ctd>r 28.75, обводка 2.5\u003c/td>\u003ctd>\u003ccode>SHIELD_R / SHIELD_W\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>супутники\u003c/td>\u003ctd>d 6 на r 29, ореол — диск r 4.8 + σ 2.2\u003c/td>\u003ctd>\u003ccode>SAT_DOT 6\u003c/code>, \u003ccode>SAT_R 29\u003c/code>, \u003ccode>SAT_GLOW 20\u003c/code> = 9.6 × 84/40\u003c/td>\u003c/tr>\u003ctr>\u003ctd>кільце комбо\u003c/td>\u003ctd>r 40, обводка 4\u003c/td>\u003ctd>\u003ccode>COMBO_R / COMBO_W\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>квад кілець\u003c/td>\u003ctd>фрейм компонента 100\u003c/td>\u003ctd>\u003ccode>RING_QUAD 100\u003c/code> — обводка до 42 + запас під AA\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Ореол супутника не підбирався оком — та сама формула, що дала \u003ccode>GLOW_SIZE = 100\u003c/code> для м'яча (текстура \u003ccode>glow\u003c/code> = диск 40 у outer 84). Порядок шарів як у SVG: ореол → щит → тіло → цятка → супутники → кільце комбо; супутники сидять на кільці щита, як у макеті \u003ccode>ball + shield + combo\u003c/code>.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>множник\u003c/th>\u003cth>супутників\u003c/th>\u003cth>де\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>x2\u003c/td>\u003ctd>1\u003c/td>\u003ctd>12-та\u003c/td>\u003c/tr>\u003ctr>\u003ctd>x3\u003c/td>\u003ctd>2\u003c/td>\u003ctd>12 і 6\u003c/td>\u003c/tr>\u003ctr>\u003ctd>x4\u003c/td>\u003ctd>3\u003c/td>\u003ctd>через 120°\u003c/td>\u003c/tr>\u003ctr>\u003ctd>x5\u003c/td>\u003ctd>4\u003c/td>\u003ctd>12, 3, 6, 9\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Крутяться 260°/с за годинниковою, як у прототипі. Кільце комбо: заповнення від 12-ї за годинниковою на \u003ccode>comboFrac\u003c/code>, доріжка з альфою 0.25 (це не з Figma, а з прототипу — крутити, якщо треба). Іскра чи гем — 100 %, далі тане; вийшло — кільце й супутники зникають.\u003c/p>\n\u003ch3>Кільце щита\u003c/h3>\n\u003cp>У грі його не було — лише піпси в HUD. Ти намалював \u003ccode>ball + shield + combo\u003c/code>, тож воно тут: той самий \u003ccode>ProgressRingEffect\u003c/code> з \u003ccode>frac = 1\u003c/code>, видиме, поки \u003ccode>engine.shield &gt; 0\u003c/code>. Без пульсу (у прототипі \u003ccode>30 + sin\u003c/code>) — у Figma його немає; скажеш — додам.\u003c/p>\n\u003ch3>Правила вікна — вже були в рушії, тепер під тестами\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>гем → 100 %\u003c/strong> — \u003ccode>gemRefillsComboWindowFully\u003c/code>;\u003c/li>\u003cli>\u003cstrong>вийшло — гасне в нуль, не x3 → x2\u003c/strong> — \u003ccode>comboExpiresToZeroNotStepDown\u003c/code>: дві іскри, далі бот тікає від усього (і від гемів — вони теж поновлюють), з 2 падає одразу в 0 за залишок вікна;\u003c/li>\u003cli>\u003cstrong>щит з'їв шип — комбо ціле\u003c/strong> — \u003ccode>shieldHitKeepsCombo\u003c/code>: порівняння з кадром *перед* ударом, бо іскру того ж шипа м'яч ловить на три кадри раніше і законно ставить 100 %;\u003c/li>\u003cli>\u003cstrong>вікно 4 с\u003c/strong> — як було.\u003c/li>\u003c/ul>\n\u003cp>Єдина зміна в рушії — \u003ccode>val comboFrac\u003c/code>.\u003c/p>\n\u003ch3>Шейдер\u003c/h3>\n\u003cp>\u003ccode>shader/orbit/progressRingFS.glsl\u003c/code> поруч з \u003ccode>orbitRingFS.glsl\u003c/code>, \u003ccode>ProgressRingEffect\u003c/code> поруч з \u003ccode>OrbitRingEffect\u003c/code> — той самий single-pass механізм, радіус задається явно (макет). Кут від 12-ї: \u003ccode>atan(p.x, −p.y)\u003c/code>, бо \u003ccode>v_localUV\u003c/code> іде Y-вниз. Торець заповнення згладжено тією ж \u003ccode>u_aa\u003c/code>, що й краї; при \u003ccode>frac = 1\u003c/code> шва на 12-й немає.\u003c/p>\n\u003ch3>Відео\u003c/h3>\n\u003cp>Допомогло: кадр на 14.7 с показав \u003ccode>COMBO x4\u003c/code> з кільцем і трьома супутниками між м'ячем і кільцем — звірив порядок шарів. Витягнув кадри через AVFoundation (\u003ccode>ffmpeg\u003c/code> тут немає).\u003c/p>\n\u003ch3>Перевірено\u003c/h3>\n\u003cul>\u003cli>\u003ccode>:engine:test\u003c/code> — \u003cstrong>16 із 16\u003c/strong>, три нових.\u003c/li>\u003cli>\u003ccode>assembleDebug\u003c/code> — \u003cstrong>BUILD SUCCESSFUL\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>На пристрої — ще ні.\u003c/strong> Перша версія (окремим актором) на Redmi 220333QNY малювалась: кільце, супутник, шейдер без помилок, 60 FPS. Цю, у \u003ccode>ABall\u003c/code>, поставити не вийшло: MIUI двічі скасував USB-встановлення (\u003ccode>INSTALL_FAILED_USER_RESTRICTED\u003c/code>). Дозволь встановлення на телефоні — зніму кадри й домалюю сюди.\u003c/li>\u003c/ul>", "files": [{"path": "engine/src/main/kotlin/com/lewydo/orbitdash/engine/RunEngine.kt", "note": "comboFrac — частка вікна для кільця.", "lang": "kotlin", "hunks": [{"verb": "add", "where": "біля рядка 610", "old": "\n    /**\n /width квада — аспект-корекція\nuniform float u_radius;    // радіус осі кільця\nuniform float u_width;     // товщина кільця\nuniform float u_aa;        // згладжування країв\nuniform vec3  u_color;     // колір кільця\nuniform float u_frac;      // заповнення 0..1 від 12-ї години за годинниковою\nuniform float u_trackA;    // альфа незаповненої частини\n\nconst float TWO_PI = 6.2831853;\n\n/** Покриття обводки товщиною w на відстані d від її осі (як в orbitRingFS). */\nfloat stroke(float d, float w) {\n    float halfW = w * 0.5;\n    return 1.0 - smoothstep(halfW - u_aa * 0.5, halfW + u_aa * 0.5, d);\n}\n\nvoid main() {\n    vec2 p = v_localUV - vec2(0.5);\n    p.y *= u_hOverW;\n\n    float ring = stroke(abs(length(p) - u_radius), u_width);\n\n    // Частка оберту від 12-ї години ЗА годинниковою. v_localUV — UV текстури,\n    // Y у нього вниз: (0,−1) — верх. atan(x, −y): верх → 0, правий бік → +¼.\n    float t = fract(atan(p.x, -p.y) / TWO_PI);\n\n    // Кінець дуги згладжений по дузі тією ж шириною u_aa, що й краї кільця\n    float e    = u_aa / (TWO_PI * max(u_radius, 1e-4));\n    float fill = 1.0 - smoothstep(u_frac - e, u_frac + e, t);\n    fill = max(fill, step(1.0, u_frac));   // повне — без шва на 12-й\n    fill *= step(1e-4, u_frac);            // нуль — сама доріжка\n\n    float a = ring * mix(u_trackA, 1.0, fill);\n    gl_FragColor = vec4(u_color, a) * v_color;\n}", "id": "3.1"}]}, {"path": "app/src/main/java/com/lewydo/orbitdash/game/utils/vfx/effects/ProgressRingEffect.kt", "note": "Новий ефект за зразком OrbitRingEffect; радіус явний.", "lang": "kotlin", "hunks": [{"verb": "create", "where": "створити", "old": null, "new": "package com.lewydo.orbitdash.game.utils.vfx.effects\n\nimport com.badlogic.gdx.graphics.Color\nimport com.badlogic.gdx.graphics.glutils.ShaderProgram\nimport com.lewydo.orbitdash.game.utils.vfx.VfxContext\nimport com.lewydo.orbitdash.game.utils.vfx.effects.base.VfxEffect\n\n// ────────────────────────────────────────────────────── (function () {
  "use strict";

  const data = JSON.parse(document.getElementById("patch-data").textContent);
  const state = data.state || (data.state = {});

  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => {

    if (text != null) n.textContent = text;
    return n;
  };
  const fmtTime = (iso) => {
    try { return new Date(iso).toLocaleString("uk-UA", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }); }

  };

  const allHunks = [];
  data.files.forEach((f) => f.hunks.forEach((h) => allHunks.push(h)));

  const submitted = () => !!state.submitted;
  const hasResults = () => allHunks.some((h) => state.hunks[h.id] && state.hunks[h.id].result);

  // Чернетка вибору до «Готово» — лише в цьому браузері; не вдалось — не страшно
  const DRAFT_KEY = "patch-draft-" + data.id;
  function loadDraft() {
    if (submitted()) return;
    try {
      const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || "{}");
      Object.keys(d).forEach((id) => {
        if (allHunks.some((h) => h.id === id)) state.hunks[id] = { choice: d[id] };
      });
    } catch (e) { /* немає сховища */ }
  }
  function saveDraft() {
    try {
      const d = {};
      Object.keys(state.hunks).forEach((id) => { if (state.hunks[id].choice) d[id] = state.hunks[id].choice; });
      localStorage.setItem(DRAFT_KEY, JSON.stringify(d));

  }

  // ── підсвітка: блок цілком (коментарі на кілька рядків), потім різання на рядки ──
  function highlight(text, lang) {
    const hl = window.hljs;
    if (!hl || !lang || !hl.getLanguage(lang)) return null;
    try { return hl.highlight(text, { language: lang, ignoreIllegals: true }).value; }
    catch (e) { return null; }
  }
  function splitHtmlLines(htmlText) {
    const lines = [];
    let cur = "";
    const open = [];
    const re = /(<span[^>]*>)|(<\/span>)|(\n)|([^<\n]+|<(?!\/?span)[^>]*>)/g;
    let m;
    while ((m = re.exec(htmlText))) {
      if (m[1]) { open.push(m[1]); cur += m[1]; }
      else if (m[2]) { open.pop(); cur += m[2]; }
      else if (m[3]) { cur += "</span>".repeat(open.length); lines.push(cur); cur = open.join(""); }
      else cur += m[4];
    }
    lines.push(cur);
    return lines;
  }
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", "");
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
      ta.remove();
      return ok;
    }
  }

  function codeBlock(kind, label, text, marks, lang) {
    const box = el("div", "code " + kind);
    const head = el("div", "code-label");
    head.appendChild(el("span", null, label));
    const btn = el("button", "copy", "Копіювати");
    btn.type = "button";
    btn.addEventListener("click", async () => {
      const ok = await copyText(text);
      btn.textContent = ok ? "Скопійовано" : "Не вдалось";
      setTimeout(() => { btn.textContent = "Копіювати"; }, 1600);
    });
    head.appendChild(btn);
    box.appendChild(head);

    const pre = el("pre");
    const code = el("code");
    const hl = highlight(text, lang);
    const lines = hl != null ? splitHtmlLines(hl) : text.split("\n").map(escapeHtml);
    code.innerHTML = lines.map((l, i) => {
      const cls = marks ? (marks[i] ? "ln chg" : "ln ctx") : "ln";
      return '<span class="' + cls + '">' + (l || "") + "</span>";
    }).join("");
    pre.appendChild(code);
    box.appendChild(pre);
    return box;
  }

  const VERB = { replace: "ЗАМІНИТИ", add: "ДОДАТИ", remove: "ВИДАЛИТИ", create: "НОВИЙ ФАЙЛ", delete: "ВИДАЛИТИ ФАЙЛ" };

      return p;

    s.choice = s.choice === choice ? null : choice;
    saveDraft();

  }

    steps.appendChild(t);

      const fh = el("div", "file-head");

          b.type = "button";

          b.addEventListener("click", () => {

            saveDraft(); render();
          });
          all.appendChild(b);
        });
        fh.appendChild(all);
      }
      card.appendChild(fh);
      if (f.note) card.appendChild(el("p", "file-note", f.note));

      f.hunks.forEach((h) => {
        const hb = el("div", "hunk");
        const top = el("div", "hunk-top");
        const ht = el("div", "hunk-title");
        ht.appendChild(el("span", "hid", h.id));
        ht.appendChild(el("span", "verb " + h.verb, VERB[h.verb] || h.verb));
        if (h.where) ht.appendChild(el("span", "where", h.where));
        const st = hunkStatus(h);
        if (st && (locked || !state.hunks[h.id] || !state.hunks[h.id].choice)) ht.appendChild(st);
        top.appendChild(ht);

        const choice = el("div", "choice");
        choice.setAttribute("role", "group");
        choice.setAttribute("aria-label", "Хто вставляє зміну " + h.id);
        const cur = (state.hunks[h.id] || {}).choice;
        [["manual", "self", "Вставив сам"], ["auto", "auto", "Вставити автоматично"]].forEach(([val, cls, label]) => {
          const b = el("button", cls, label);
          b.type = "button";

          b.disabled = locked;
          b.addEventListener("click", () => setChoice(h.id, val));

        });
        top.appendChild(choice);
        hb.appendChild(top);

        const lang = h.lang || f.lang;
        if (h.old != null) hb.appendChild(codeBlock("old", h.verb === "add" ? "Знайти (вже є у файлі)" : "Було", h.old, h.oldMarks, lang));

        card.appendChild(hb);

      steps.appendChild(card);

    root.appendChild(steps);
    window.scrollTo(0, scrollY);
  }

  // ── панель ───────────────────────────────────────────────────────────

  function counts() {

    allHunks.forEach((h) => {

      if (c === "manual") self++; else if (c === "auto") auto++; else none++;
    });
    return { self, auto, none };
  }

  function renderBar() {

    status.textContent = ""; bulk.textContent = "";
    const c = counts();

      return;

    if (!artifactApi) status.appendChild(el("span", "note", "надіслати можна на claude.ai; інакше напиши в чат"));

  }

      $("status").appendChild(el("span", "note", code === "not_writer" || code === "not_granted"
        ? "у тебе немає права змінювати цю сторінку"
        : "не вдалось надіслати — напиши в чат"));
    }
  }

  $("send").addEventListener("click", () => {
    if (!artifactApi || busy) return;
    if (submitted()) {           // «Змінити вибір» — поки Claude не почав
      if (hasResults()) return;
      state.submitted = null;
    } else {
      if (counts().none > 0) return;
      state.submitted = new Date().toISOString();
    }
    publish();
  });

  loadDraft();
  render();

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then((api) => { artifactApi = api; renderBar(); })
      .catch(() => { artifactApi = null; renderBar(); });
  }
})();
</script></body></html>
