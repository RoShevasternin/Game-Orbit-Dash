* { box-sizing: border-box; }

.head { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }

.pill.new     { color: var(--muted); background: var(--sunk); border: 1px solid var(--line); }

/* ── панель ────────────────────────────────────────── */

<script id="patch-data" type="application/json">{"id": "57", "title": "ProgressBarEffect — доріжка й заповнення однією фігурою", "date": "20.09.2026", "order": "1 → 3. Кроки 1 і 2 — нові файли, обидва до 3. Компілюється після 3.", "summaryHtml": "\u003ch3>Що і навіщо\u003c/h3>\n\u003cp>У патчі 56 смуга часу була зроблена двома \u003ccode>ARoundRect\u003c/code> — доріжка й заповнення окремими акторами. Працює, але коштує \u003cstrong>два перемикання шейдера\u003c/strong> в батчі HUD, а ширину заповнення доводиться щокадру ставити руками, поза реєстром розмірів.\u003c/p>\n\u003cp>Ти запропонував інший шлях: запекти форму в \u003ccode>VfxTexture\u003c/code> і різати маскою, як в \u003ccode>AProgress\u003c/code>. Напрямок правильний — рахувати форму щокадру справді не треба, — але \u003cstrong>саме маска тут гірша за обидва варіанти\u003c/strong>, і є третій, кращий.\u003c/p>\n\u003ch3>Чому не \u003ccode>AMask\u003c/code>\u003c/h3>\n\u003cp>\u003ccode>AMask\u003c/code> — це \u003ccode>VfxGroup\u003c/code>, тобто власний FBO з кешем, який перемальовується, \u003cstrong>коли діти рухаються\u003c/strong>. У прогресі дитина рухається щокадру: кеш злітає кожен кадр, і замість двох дешевих квадів виходить bind FBO + перемальовка 60 разів на секунду. Маска виправдана, коли під нею живий складний вміст (як у \u003ccode>ABlurBack\u003c/code>), а не одна кольорова смужка.\u003c/p>\n\u003cp>Сам \u003ccode>AProgress\u003c/code> при цьому — чернетка: рожева дебаг-текстура, ассет маски закоментований, і в грі його ніхто не використовує.\u003c/p>\n\u003ch3>Що робимо натомість\u003c/h3>\n\u003cp>\u003ccode>ProgressBarEffect\u003c/code> — \u003cstrong>лінійний двійник \u003ccode>ProgressRingEffect\u003c/code>\u003c/strong>, того самого шейдера, який уже малює кільце комбо й щит на м'ячі. Там доріжка й заповнення — одна фігура в одному квадi, а \u003ccode>frac\u003c/code> — юніформ; тут те саме, тільки по прямій.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>було (патч 56)\u003c/th>\u003cth>стало\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>акторів на смугу\u003c/td>\u003ctd>2\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>перемикань шейдера\u003c/td>\u003ctd>2\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>хто рухає заповнення\u003c/td>\u003ctd>код, щокадру \u003ccode>setBounds\u003c/code>\u003c/td>\u003ctd>юніформ \u003ccode>frac\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>правий край заповнення\u003c/td>\u003ctd>заокруглений (окрема капсула)\u003c/td>\u003ctd>заокруглений (та сама капсула, коротша)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Коли заповнення стає вужчим за власну висоту, радіус сам стискається до половини ширини — смуга гасне в крапку, а не в пелюстку.\u003c/p>\n\u003cp>Доріжка й заповнення мають окремі кольори (\u003ccode>trackColor\u003c/code>, \u003ccode>fillColor\u003c/code>) і складаються в \u003cstrong>премультиплікованому\u003c/strong> вигляді з діленням на альфу наприкінці — як у \u003ccode>roundRectFS\u003c/code>. Без цього на межі заповнення був би кант не того відтінку: біла доріжка 0.2 під кольоровим заповненням змішалась би в пропорції, яка не знає про альфу.\u003c/p>\n\u003ch3>Де лежить\u003c/h3>\n\u003cp>Шейдер — \u003ccode>assets/shader/base/progressBar/progressBarFS.glsl\u003c/code>, поруч з \u003ccode>roundRect\u003c/code>: це базова фігура UI, не орбіта. Ефект — \u003ccode>utils/vfx/effects/base/ProgressBarEffect.kt\u003c/code>, поруч з \u003ccode>RoundRectEffect\u003c/code>. Окремого актора не заводив: панель тримає \u003ccode>VfxImage\u003c/code> з ефектом напряму, так само як \u003ccode>ABall\u003c/code> тримає свої кільця.\u003c/p>\n\u003cp>Зібрано в лабораторії: \u003ccode>assembleDebug\u003c/code> — BUILD SUCCESSFUL. Шейдер компілюється вже на пристрої, тому перша перевірка — запустити й узяти магніт: смуга має бути кольору буста і збігати рівно.\u003c/p>", "files": [{"path": "app/src/main/assets/shader/base/progressBar/progressBarFS.glsl", "note": "НОВИЙ ФАЙЛ. Нова тека shader/base/progressBar/.", "lang": "glsl", "hunks": [{"verb": "create", "where": "створити", "old": null, "new": "#ifdef GL_ES\nprecision mediump float;\n#endif\n\n// ─────────────────────────────────────────────────────────────────────────────\n// PROGRESS BAR — капсула із заповненням зліва, один прохід.\n//\n// Лінійний двійник progressRingFS: доріжка на всю довжину з альфою u_trackA і\n// заповнення на u_frac довжини. Обидві смуги — ОДНА фігура в одному квадi,\n// тому це один актор і один draw, а не «доріжка + заповнення» двома акторами.\n//\n// Заповнення — та сама капсула, лише коротша, тож правий кінець у нього\n// заокруглений, як у Figma. Коли воно вужче за власну висоту, радіус сам\n// стискається до половини ширини — смуга гасне в крапку, а не в пелюстку.\n//\n// Доріжка й заповнення мають власні кольори: у грі доріжка біла й ледь видима,\n// заповнення — кольору активного буста. Складаються в ПРЕМУЛЬТИПЛІКОВАНОМУ\n// вигляді й діляться на альфу наприкінці — як у roundRectFS, інакше на межі\n// заповнення був би кант не того відтінку.\n//\n// Розміри у world-юнітах: радіус 1.5 лишається 1.5 і на 64×3, і на 200×8.\n// ─────────────────────────────────────────────────────────────────────────────\n\nvarying vec4 v_color;\nvarying vec2 v_localUV;\n\nuniform vec2  u_size;        // розмір квада у world-юнітах\nuniform float u_radius;      // радіус кінців\nuniform float u_aa;          // згладжування\nuniform float u_frac;        // заповнення 0..1 зліва направо\nuniform float u_trackA;      // альфа незаповненої частини\nuniform vec3  u_trackColor;  // білий = «колір беремо з тінту актора»\nuniform vec3  u_fillColor;\n\n// Знакова відстань до заокругленого прямокутника: \u003c0 усередині, >0 назовні\nfloat roundedBox(vec2 p, vec2 halfSize, float r) {\n    vec2 q = abs(p) - halfSize + r;\n    return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;\n}\n\nvoid main() {\n    vec2 p = (v_localUV - 0.5) * u_size;\n\n    // AA йде ВСЕРЕДИНУ: d = 0 припадає рівно на межу квада, назовні місця немає\n    float track = 1.0 - smoothstep(-u_aa, 0.0, roundedBox(p, u_size * 0.5, u_radius));\n\n    // Заповнення: капсула завдовжки u_frac, притиснута до лівого краю\n    float f  = clamp(u_frac, 0.0, 1.0);\n    float w  = u_size.x * f;\n    vec2  hs = vec2(w * 0.5, u_size.y * 0.5);\n    vec2  pf = p - vec2(w * 0.5 - u_size.x * 0.5, 0.0);\n\n    float fill = 1.0 - smoothstep(-u_aa, 0.0, roundedBox(pf, hs, min(u_radius, w * 0.5)));\n    fill *= step(0.0001, f);                       // нуль — лишається сама доріжка\n\n    float trackA = track * u_trackA;\n\n    // Заповнення НАД доріжкою (alpha over), як обводка над заливкою в roundRect\n    float a = fill + trackA * (1.0 - fill);\n\n    vec3 rgb = u_fillColor * fill + u_trackColor * trackA * (1.0 - fill);\n    rgb /= max(a, 0.0001);                         // назад у пряму альфу\n\n    gl_FragColor = vec4(rgb, a) * v_color;\n}", "id": "1.1"}]}, {"path": "app/src/main/java/com/lewydo/orbitdash/game/utils/vfx/effects/base/ProgressBarEffect.kt", "note": "НОВИЙ ФАЙЛ. Поруч з RoundRectEffect.", "lang": "kotlin", "hunks": [{"verb": "create", "where": "створити", "old": null, "new": "package com.lewydo.orbitdash.game.utils.vfx.effects.base\n\nimport com.badlogic.gdx.graphics.Color\nimport com.badlogic.gdx.graphics.glutils.ShaderProgram\nimport com.lewydo.orbitdash.game.utils.vfx.VfxContext\n\n// ─────────────────────────────────────────────────────────────────────────────\n// ProgressBarEffect — смуга прогресу капсулою (single-pass).\n//\n// Те саме, що ProgressRingEffect робить для кільця, тільки по прямій: доріжка\n// з альфою trackAlpha на всю довжину і заповнення на frac зліва. Одна фігура —\n// один актор і один draw; двома акторами це коштувало б два перемикання\n// шейдера в батчі HUD.\n//\n// Доріжка й заповнення мають окремі кольори, бо в грі вони різні: доріжка\n// біла й ледь видима, заповнення — к <script id="app">
(function () {
  "use strict";

  const data = JSON.parse(document.getElementById("patch-data").textContent);
  const state = data.state || (data.state = {});
  state.hunks = state.hunks || {};

  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };
  const fmtTime = (iso) => {
    try { return new Date(iso).toLocaleString("uk-UA", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }); }
    catch (e) { return iso || ""; }
  };

  const allHunks = [];
  data.files.forEach((f) => f.hunks.forEach((h) => allHunks.push(h)));

  const submitted = () => !!state.submitted;
  const hasResults = () => allHunks.some((h) => state.hunks[h.id] && state.hunks[h.id].result);

  // Чернетка вибору до «Готово» — лише в цьому браузері; не вдалось — не страшно
  const DRAFT_KEY = "patch-draft-" + data.id;
  function loadDraft() {
    if (submitted()) return;
    try {
      const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || "{}");
      Object.keys(d).forEach((id) => {
        if (allHunks.some((h) => h.id === id)) state.hunks[id] = { choice: d[id] };
      });
    } catch (e) { /* немає сховища */ }
  }
  function saveDraft() {
    try {
      const d = {};
      Object.keys(state.hunks).forEach((id) => { if (state.hunks[id].choice) d[id] = state.hunks[id].choice; });
      localStorage.setItem(DRAFT_KEY, JSON.stringify(d));
    } catch (e) { /* немає сховища */ }
  }

  // ── підсвітка: блок цілком (коментарі на кілька рядків), потім різання на рядки ──
  function highlight(text, lang) {
    const hl = window.hljs;
    if (!hl || !lang || !hl.getLanguage(lang)) return null;
    try { return hl.highlight(text, { language: lang, ignoreIllegals: true }).value; }
    catch (e) { return null; }
  }
  function splitHtmlLines(htmlText) {
    const lines = [];
    let cur = "";
    const open = [];
    const re = /(<span[^>]*>)|(<\/span>)|(\n)|([^<\n]+|<(?!\/?span)[^>]*>)/g;
    let m;
    while ((m = re.exec(htmlText))) {
      if (m[1]) { open.push(m[1]); cur += m[1]; }
      else if (m[2]) { open.pop(); cur += m[2]; }
      else if (m[3]) { cur += "</span>".repeat(open.length); lines.push(cur); cur = open.join(""); }
      else cur += m[4];
    }
    lines.push(cur);
    return lines;
  }
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", "");
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
      ta.remove();
      return ok;
    }
  }

  function codeBlock(kind, label, text, marks, lang) {
    const box = el("div", "code " + kind);
    const head = el("div", "code-label");
    head.appendChild(el("span", null, label));
    const btn = el("button", "copy", "Копіювати");
    btn.type = "button";
    btn.addEventListener("click", async () => {
      const ok = await copyText(text);
      btn.textContent = ok ? "Скопійовано" : "Не вдалось";
      setTimeout(() => { btn.textContent = "Копіювати"; }, 1600);
    });
    head.appendChild(btn);
    box.appendChild(head);

    const pre = el("pre");
    const code = el("code");
    const hl = highlight(text, lang);
    const lines = hl != null ? splitHtmlLines(hl) : text.split("\n").map(escapeHtml);
    code.innerHTML = lines.map((l, i) => {
      const cls = marks ? (marks[i] ? "ln chg" : "ln ctx") : "ln";
      return '<span class="' + cls + '">' + (l || "") + "</span>";
    }).join("");
    pre.appendChild(code);
    box.appendChild(pre);
    return box;
  }

  const VERB = { replace: "ЗАМІНИТИ", add: "ДОДАТИ", remove: "ВИДАЛИТИ", create: "НОВИЙ ФАЙЛ", delete: "ВИДАЛИТИ ФАЙЛ" };

  function hunkStatus(h) {
    const s = state.hunks[h.id];
    if (!s || !s.choice) return el("span", "pill new", "не обрано");
    if (s.result) {
      const p = el("span", "pill " + (s.result.ok ? "done" : "fail"), s.result.note || (s.result.ok ? "готово" : "не вийшло"));
      return p;
    }
    if (submitted()) return el("span", "pill pending", s.choice === "auto" ? "Claude вставляє" : "Claude перевіряє");
    return null;
  }

  function setChoice(id, choice) {
    if (submitted()) return;
    const s = state.hunks[id] || (state.hunks[id] = {});
    s.choice = s.choice === choice ? null : choice;
    saveDraft();
    render();
  }

  function renderPage() {
    const root = $("root");
    const scrollY = window.scrollY;
    root.textContent = "";

    const head = el("header", "head");
    const eyebrow = el("div", "eyebrow");
    eyebrow.appendChild(el("span", "num", "патч " + data.id));
    if (data.date) eyebrow.appendChild(el("span", null, data.date));
    head.appendChild(eyebrow);
    head.appendChild(el("h1", null, data.title));
    root.appendChild(head);

    // summaryHtml генерує Claude з власного .md — довірений вміст
    const summary = el("section", "summary");
    summary.innerHTML = data.summaryHtml || "";
    root.appendChild(summary);

    const steps = el("section", "steps");
    const t = el("div", "steps-title");
    t.appendChild(el("h2", null, "Зміни"));
    t.appendChild(el("p", null, (data.order ? data.order + " " : "") +
      "Біля кожної зміни обери, хто її вставляє, потім «Готово» внизу."));
    steps.appendChild(t);

    const locked = submitted();
    data.files.forEach((f, fi) => {
      const card = el("article", "file");
      const fh = el("div", "file-head");
      const fid = el("div", "file-id");
      fid.appendChild(el("span", "idx", String(fi + 1)));
      fid.appendChild(el("span", "path", f.path));
      fh.appendChild(fid);
      if (f.hunks.length > 1) {
        const all = el("div", "file-all");
        all.appendChild(el("span", null, "увесь файл:"));
        [["self", "сам"], ["auto", "авто"]].forEach(([c, label]) => {
          const b = el("button", "link", label);
          b.type = "button";
          b.disabled = locked;
          b.addEventListener("click", () => {
            f.hunks.forEach((h) => { (state.hunks[h.id] || (state.hunks[h.id] = {})).choice = c === "self" ? "manual" : "auto"; });
            saveDraft(); render();
          });
          all.appendChild(b);
        });
        fh.appendChild(all);
      }
      card.appendChild(fh);
      if (f.note) card.appendChild(el("p", "file-note", f.note));

      f.hunks.forEach((h) => {
        const hb = el("div", "hunk");
        const top = el("div", "hunk-top");
        const ht = el("div", "hunk-title");
        ht.appendChild(el("span", "hid", h.id));
        ht.appendChild(el("span", "verb " + h.verb, VERB[h.verb] || h.verb));
        if (h.where) ht.appendChild(el("span", "where", h.where));
        const st = hunkStatus(h);
        if (st && (locked || !state.hunks[h.id] || !state.hunks[h.id].choice)) ht.appendChild(st);
        top.appendChild(ht);

        const choice = el("div", "choice");
        choice.setAttribute("role", "group");
        choice.setAttribute("aria-label", "Хто вставляє зміну " + h.id);
        const cur = (state.hunks[h.id] || {}).choice;
        [["manual", "self", "Вставив сам"], ["auto", "auto", "Вставити автоматично"]].forEach(([val, cls, label]) => {
          const b = el("button", cls, label);
          b.type = "button";
          b.setAttribute("aria-pressed", String(cur === val));
          b.disabled = locked;
          b.addEventListener("click", () => setChoice(h.id, val));
          choice.appendChild(b);
        });
        top.appendChild(choice);
        hb.appendChild(top);

        const lang = h.lang || f.lang;
        if (h.old != null) hb.appendChild(codeBlock("old", h.verb === "add" ? "Знайти (вже є у файлі)" : "Було", h.old, h.oldMarks, lang));
        if (h.new != null) hb.appendChild(codeBlock("new", h.verb === "create" ? "Файл цілком" : "Стало", h.new, h.newMarks, lang));
        card.appendChild(hb);
      });
      steps.appendChild(card);
    });
    root.appendChild(steps);
    window.scrollTo(0, scrollY);
  }

  // ── панель ───────────────────────────────────────────────────────────
  let artifactApi = null;
  let busy = false;

  function counts() {
    let self = 0, auto = 0, none = 0;
    allHunks.forEach((h) => {
      const c = (state.hunks[h.id] || {}).choice;
      if (c === "manual") self++; else if (c === "auto") auto++; else none++;
    });
    return { self, auto, none };
  }

  function renderBar() {
    const status = $("status"), bulk = $("bulk"), send = $("send");
    status.textContent = ""; bulk.textContent = "";
    const c = counts();

    if (state.result) {
      status.appendChild(el("span", "pill " + (state.result.ok ? "done" : "fail"), state.result.ok ? "Готово" : "Є проблеми"));
      status.appendChild(el("span", null, fmtTime(state.result.at)));
      if (state.result.note) status.appendChild(el("span", "note", state.result.note));
      send.hidden = true;
      return;
    }

    const tally = el("span", "tally", "сам " + c.self + " · авто " + c.auto + (c.none ? " · не обрано " + c.none : ""));
    status.appendChild(tally);

    if (submitted()) {
      status.appendChild(el("span", "pill pending", "Надіслано"));
      status.appendChild(el("span", "note", fmtTime(state.submitted) + " — Claude вставить «авто», перевірить «сам» і збере проєкт"));
      send.hidden = hasResults();
      send.className = "send ghost";
      send.textContent = "Змінити вибір";
      send.disabled = !artifactApi || busy;
      return;
    }

    if (!artifactApi) status.appendChild(el("span", "note", "надіслати можна на claude.ai; інакше напиши в чат"));
    else if (c.none) status.appendChild(el("span", "note", "обери для кожної зміни"));

    bulk.appendChild(el("span", null, "усе одразу:"));
    [["manual", "усе сам"], ["auto", "усе автоматично"], [null, "очистити"]].forEach(([val, label]) => {
      const b = el("button", "link", label);
      b.type = "button";
      b.addEventListener("click", () => {
        allHunks.forEach((h) => { (state.hunks[h.id] || (state.hunks[h.id] = {})).choice = val; });
        saveDraft(); render();
      });
      bulk.appendChild(b);
    });

    send.hidden = false;
    send.className = "send";
    send.textContent = c.none ? "Готово — ще " + c.none + " без вибору" : "Готово — надіслати Claude";
    send.disabled = !artifactApi || busy || c.none > 0;
  }

  function render() { renderPage(); renderBar(); }

  // Документ = незмінні частини + новий стан; живий DOM не серіалізуємо
  const HEAD_EXTRA =
    '<link rel="preconnect" href="https://fonts.googleapis.com">' +
    '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>' +
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">' +
    '<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"><\/script>' +
    '<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/glsl.min.js"><\/script>';
  const BAR =
    '<div class="bar" id="bar"><div class="bar-inner">' +
    '<div class="status" id="status"></div><div class="bulk" id="bulk"></div>' +
    '<button class="send" id="send" type="button">Готово — надіслати Claude</button>' +
    '</div></div>';

  function buildDocument() {
    const style = document.getElementById("style").outerHTML;
    const app = document.getElementById("app").textContent;
    const json = JSON.stringify(data).replace(/</g, "\\u003c");
    return "<!doctype html><html lang=\"uk\"><head><meta charset=\"utf-8\">" +
      "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">" +
      "<title>" + document.title.replace(/</g, "&lt;") + "</title>" + HEAD_EXTRA + style +
      "</head><body><main class=\"page\" id=\"root\"></main>" + BAR +
      "<script id=\"patch-data\" type=\"application/json\">" + json + "<\/script>" +
      "<script id=\"app\">" + app + "<\/script></body></html>";
  }

  async function publish() {
    busy = true; renderBar();
    try {
      await artifactApi.publish(buildDocument());
      try { localStorage.removeItem(DRAFT_KEY); } catch (e) { /* немає сховища */ }
    } catch (e) {
      busy = false;
      const code = e && e.code;
      if (code === "conflict") return;
      state.submitted = null;
      render();
      $("status").appendChild(el("span", "note", code === "not_writer" || code === "not_granted"
        ? "у тебе немає права змінювати цю сторінку"
        : "не вдалось надіслати — напиши в чат"));
    }
  }

  $("send").addEventListener("click", () => {
    if (!artifactApi || busy) return;
    if (submitted()) {           // «Змінити вибір» — поки Claude не почав
      if (hasResults()) return;
      state.submitted = null;
    } else {
      if (counts().none > 0) return;
      state.submitted = new Date().toISOString();
    }
    publish();
  });

  loadDraft();
  render();

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then((api) => { artifactApi = api; renderBar(); })
      .catch(() => { artifactApi = null; renderBar(); });
  }
})();
</script>
