<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тюнер 66 · Віньєтка буста</title>
<style id="style">
:root {
  --bg:      #0B0D14;
  --panel:   #141824;
  --sunk:    #0E1119;
  --line:    #262C3B;
  --text:    #E7ECF5;
  --muted:   #9AA3B5;
  --faint:   #626C82;
  --accent:  #4DA3FF;
  --ok:      #56D48A;
  --warn:    #FFC857;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.55 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
.page { max-width: 860px; margin: 0 auto; padding: 22px 16px 200px; }
h1 { font-size: 24px; font-weight: 700; margin: 4px 0 8px; letter-spacing: -.01em; }
.eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
p { margin: 0 0 12px; color: var(--muted); }
code { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: .88em;
  background: var(--sunk); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── сцена ──────────────────────────────────────────────── */
.stage { display: flex; justify-content: center; margin: 18px 0 10px; }
canvas {
  width: 320px; max-width: 100%; aspect-ratio: 360 / 825; display: block;
  border-radius: 18px; background: #0E1024; touch-action: manipulation;
  box-shadow: 0 10px 40px rgba(0,0,0,.5); border: 1px solid var(--line);
}
.scene-bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 18px; }
.chip {
  background: var(--panel); border: 1px solid var(--line); color: var(--muted);
  border-radius: 999px; padding: 7px 13px; cursor: pointer; font-size: 13px; font-weight: 600;
}
.chip[aria-pressed="true"] { color: #0B0D14; background: var(--dot, var(--accent)); border-color: transparent; }
.chip.ghost[aria-pressed="true"] { background: var(--accent); }

/* ── групи повзунків ────────────────────────────────────── */
.group { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); margin-bottom: 14px; overflow: hidden; }
.group > header { padding: 11px 14px; background: var(--sunk); border-bottom: 1px solid var(--line); }
.group h2 { margin: 0; font-size: 14px; font-weight: 700; }
.group .sub { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--faint); }
.group .desc { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); }
.rows { padding: 6px 14px 12px; }

.row { padding: 9px 0; border-bottom: 1px dashed var(--line); }
.row:last-child { border-bottom: 0; }
.row .top { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; }
.row .name { font-size: 13.5px; }
.row .name b { font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 12.5px; }
.row .val { font-family: "JetBrains Mono", monospace; font-size: 13px; color: var(--muted); white-space: nowrap; }
.row.changed .val { color: var(--warn); }
.row .def { color: var(--faint); font-size: 11px; }
.row .hint { margin: 2px 0 0; font-size: 12px; color: var(--faint); }
.row input[type=range] { width: 100%; margin: 6px 0 0; accent-color: var(--accent); }
.row .reset { background: none; border: 0; color: var(--faint); cursor: pointer; font-size: 11px; padding: 0 2px; }
.row.changed .reset { color: var(--accent); }
.seg { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.seg button {
  flex: 1; min-width: 90px; background: var(--sunk); color: var(--muted);
  border: 1px solid var(--line); border-radius: 9px; padding: 8px 6px; cursor: pointer; font-size: 12.5px; font-weight: 600;
}
.seg button[aria-pressed="true"] { background: var(--accent); border-color: transparent; color: #0B0D14; }

textarea {
  width: 100%; min-height: 76px; resize: vertical; background: var(--sunk); color: var(--text);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px; font: inherit;
}

/* ── нижня панель ───────────────────────────────────────── */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--panel);
  border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -8px 26px rgba(0,0,0,.45);
}
.bar-inner { max-width: 830px; margin: 0 auto; display: flex; flex-direction: column; gap: 9px; }
.status { font-size: 13.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.pill { border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; }
.pill.sent { background: #16304F; color: #9CD0FF; }
.pill.done { background: #15301F; color: var(--ok); }
.send {
  width: 100%; border-radius: 12px; padding: 14px; cursor: pointer; font-weight: 700; font-size: 15px;
  background: var(--accent); color: #07101D; border: 2px solid var(--accent);
}
.send.ghost { background: transparent; color: var(--accent); }
.send:disabled { opacity: .45; cursor: not-allowed; }
@media (max-width: 420px) { h1 { font-size: 20px; } }
</style>
</head>
<body>
<main class="page" id="root"></main>
<div class="bar" id="bar"></div>

<script id="tuner-data" type="application/json">{"id":"66","v":1,"title":"Віньєтка активного буста","patch":null,"state":{"values":{},"note":"","submitted":null,"result":null}}</script>
<script id="app">
(function () {
  "use strict";
  const data  = JSON.parse(document.getElementById("tuner-data").textContent);
  const state = data.state || (data.state = {});
  state.values = state.values || {};

  // ─────────────────────────────────────────────────────────────────────────
  //  ЧИСЛА СЦЕНИ — зі справжнього коду гри, не з ока:
  //    екран 360×825 юнітів (WIDTH_UI), поле FIELD_SIZE 320 (GameScreen),
  //    HUD 332×70 на margin 17 зверху, поле на 36 нижче нього,
  //    орбіти LAYOUT_2 [190, 320] і LAYOUT_3 [130, 225, 320] — ДІАМЕТРИ
  //    (AOrbitField), товщина 3 / активна 4.5, м'яч 22, ореол на 10 всередину.
  //    Палітра NEON (Theme.kt), кольори бустів (BoostCatalog).
  // ─────────────────────────────────────────────────────────────────────────
  const SCREEN = { w: 360, h: 825 };
  const HUD    = { w: 332, h: 70, top: 17 };
  const FIELD  = 320;
  const LAYOUT_2 = [190, 320];
  const LAYOUT_3 = [130, 225, 320];
  const RING_TH = 3, RING_TH_ACT = 4.5, BALL = 22, HALO_GAP = 10;

  const NEON = { bg: "#0E1024", ring: "#2B3060", player: "#00E5FF", gem: "#FFD54A", spike: "#FF3D68" };

  // Тривалості — з RunEngine.Boost; кольори — з BoostCatalog
  const BOOSTS = {
    MAGNET: { label: "MAGNET",  color: "#C07BFF", dur: 8  },
    FRENZY: { label: "GEM x2",  color: "#FFD54A", dur: 10 },
    SLOW:   { label: "SLOW-MO", color: "#FFFFFF", dur: 4  },
  };
  /** Альтернативний колір для SLOW, якщо білий не читається. */
  const ICE = "#8FE3FF";

  // ─────────────────────────────────────────────────────────────────────────
  //  Повзунки = майбутні константи AVignette. def — те, що я поставив би сам.
  // ─────────────────────────────────────────────────────────────────────────
  const PARAMS = [
    { g: "shape", key: "INNER", label: "де починається", min: 0.1, max: 0.95, step: 0.01, def: 0.45, unit: "",
      hint: "частка півдіагоналі екрана: 0 — від центру, 1 — від самого краю" },
    { g: "shape", key: "POW", label: "різкість спаду", min: 0.6, max: 4, step: 0.1, def: 2.0, unit: "",
      hint: "1 — лінійно, більше — довго нічого й раптом край" },
    { g: "shape", key: "ELLIPSE", type: "bool", label: "еліпс за формою екрана", def: true,
      hint: "вимкнено — коло: кути темніші за боки" },

    { g: "color", key: "TINT_A", label: "колір буста, альфа", min: 0, max: 0.9, step: 0.01, def: 0.34, unit: "" },
    { g: "color", key: "DARK_A", label: "затемнення, альфа", min: 0, max: 0.7, step: 0.01, def: 0.22, unit: "",
      hint: "чорний під кольором: без нього кольорове світіння освітлює екран, а не обрамляє" },
    { g: "color", key: "ADDITIVE", type: "bool", label: "колір адитивно", def: true,
      hint: "lighter: світиться, як неон. Вимкнено — звичайна альфа, спокійніше" },

    { g: "time", key: "FADE_IN",  label: "поява", min: 0, max: 1, step: 0.05, def: 0.15, unit: "с" },
    { g: "time", key: "FADE_OUT", label: "згасання", min: 0, max: 1.5, step: 0.05, def: 0.35, unit: "с" },
    { g: "time", key: "PULSE_LAST", label: "пульс за скільки до кінця", min: 0, max: 3, step: 0.1, def: 1.0, unit: "с",
      hint: "0 — без пульсу; гравець бачить «ось-ось скінчиться», не дивлячись на смугу" },
    { g: "time", key: "PULSE_DEPTH", label: "глибина пульсу", min: 0, max: 1, step: 0.05, def: 0.45, unit: "",
      hint: "частка альфи, яка знімається у провалі пульсу" },
    { g: "time", key: "PULSE_HZ", label: "темп пульсу", min: 0.5, max: 6, step: 0.1, def: 2.6, unit: "Гц" },

    { g: "slow", key: "SLOW_MODE", type: "enum", label: "SLOW-MO — чим фарбувати", def: "ice",
      options: [
        { v: "white", t: "білим (як у каталозі)" },
        { v: "ice",   t: "крижаним #8FE3FF" },
        { v: "dark",  t: "лише затемнення" },
      ],
      hint: "у BoostCatalog SLOW = #FFFFFF. Біла віньєтка на темному фоні читається як засвітка — тут вирішуємо, як бути" },
  ];
  const GROUPS = {
    shape: { title: "Форма", sub: "AVignette", desc: "Профіль альфи від центру до краю. Малюється один раз у текстуру, на екрані лише тінт." },
    color: { title: "Колір", sub: "AVignette + BoostCatalog", desc: "Колір буста йде тінтом актора — це безкоштовно. Затемнення під ним окремим шаром." },
    time:  { title: "Час",   sub: "AVignette.act()", desc: "Джерело — engine.activeBoost і engine.boostFrac, ті самі, що читає APanelBooster." },
    slow:  { title: "Окремий випадок SLOW-MO", sub: "BoostCatalog", desc: "Єдиний буст, чий колір білий." },
  };
  const P = {}; PARAMS.forEach((p) => { P[p.key] = p; });

  const locked = () => !!state.submitted;
  const valOf  = (k) => (k in state.values ? state.values[k] : P[k].def);
  const isDef  = (k) => valOf(k) === P[k].def;
  const dec    = (p) => { const s = String(p.step); return s.includes(".") ? s.split(".")[1].length : 0; };
  const fmt    = (p, v) => {
    if (p.type === "bool") return v ? "так" : "ні";
    if (p.type === "enum") return (p.options.find((o) => o.v === v) || {}).t || v;
    return Number(v).toFixed(dec(p)) + (p.unit ? " " + p.unit : "");
  };

  // ── чернетка в браузері до «Готово» ──────────────────────────────────────
  const DRAFT_KEY = "tuner-draft-" + data.id;
  function loadDraft() {
    if (locked()) return;
    try {
      const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null");
      if (!d) return;
      if (d.values) Object.keys(d.values).forEach((k) => { if (P[k]) state.values[k] = d.values[k]; });
      if (typeof d.note === "string") state.note = d.note;
    } catch (e) { /* немає сховища */ }
  }
  let draftTimer = 0;
  function saveDraft() {
    clearTimeout(draftTimer);
    draftTimer = setTimeout(() => {
      try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ values: state.values, note: state.note || "" })); }
      catch (e) { /* немає сховища */ }
    }, 250);
  }

  const $ = (id) => document.getElementById(id);
  function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

  // ─────────────────────────────────────────────────────────────────────────
  //  СЦЕНА. Юніти екрана → пікселі канваса одним множником, як viewport гри.
  // ─────────────────────────────────────────────────────────────────────────
  const view = {
    boost: "MAGNET",
    t: 0,              // скільки буст уже триває, с
    running: true,
    loop: true,
    angle: 0,
    ring: 0,
    rings: 2,
  };

  const hex = (h) => {
    const s = h.replace("#", "");
    return [parseInt(s.slice(0, 2), 16), parseInt(s.slice(2, 4), 16), parseInt(s.slice(4, 6), 16)];
  };
  const rgba = (h, a) => { const c = hex(h); return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")"; };

  /** Колір, яким фарбується віньєтка цього буста (з урахуванням режиму SLOW). */
  function vignetteColor() {
    const b = BOOSTS[view.boost];
    if (view.boost !== "SLOW") return b.color;
    const mode = valOf("SLOW_MODE");
    return mode === "ice" ? ICE : b.color;
  }
  function tintAlphaFor() {
    if (view.boost === "SLOW" && valOf("SLOW_MODE") === "dark") return 0;
    return valOf("TINT_A");
  }

  /**
   * Множник альфи в момент t: поява → 1 → пульс в останні PULSE_LAST →
   * згасання після кінця. Рівно те, що робитиме AVignette.act() від boostFrac.
   */
  function envelope(t) {
    const dur = BOOSTS[view.boost].dur;
    const fi  = valOf("FADE_IN"), fo = valOf("FADE_OUT");
    if (t < 0) return 0;
    if (t > dur) return Math.max(0, 1 - (t - dur) / Math.max(1e-3, fo));
    let a = fi > 0 ? Math.min(1, t / fi) : 1;
    const left = dur - t, last = valOf("PULSE_LAST");
    if (last > 0 && left < last) {
      const k = 1 - left / last;                                   // 0 → 1 до кінця
      const s = 0.5 - 0.5 * Math.cos(2 * Math.PI * valOf("PULSE_HZ") * t);
      a *= 1 - valOf("PULSE_DEPTH") * s * k;
    }
    return a;
  }

  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  let S = 1;   // пікселів на юніт

  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const rect = canvas.getBoundingClientRect();
    if (!rect.width) return;
    canvas.width  = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.width * dpr * SCREEN.h / SCREEN.w);
    S = canvas.width / SCREEN.w;
  }

  const stars = Array.from({ length: 46 }, () => ({
    x: Math.random() * SCREEN.w, y: Math.random() * SCREEN.h,
    r: 0.4 + Math.random() * 1.1, a: 0.15 + Math.random() * 0.45,
  }));

  function ringD(i) { return (view.rings >= 3 ? LAYOUT_3 : LAYOUT_2)[i]; }

  function drawScene(dt) {
    const cx = SCREEN.w / 2;
    const fieldTop = HUD.top + HUD.h + 36;
    const fy = fieldTop + FIELD / 2;                 // центр поля, юніти

    ctx.setTransform(S, 0, 0, S, 0, 0);
    ctx.clearRect(0, 0, SCREEN.w, SCREEN.h);

    // фон + зорі
    ctx.fillStyle = NEON.bg; ctx.fillRect(0, 0, SCREEN.w, SCREEN.h);
    for (const s of stars) { ctx.fillStyle = "rgba(255,255,255," + s.a + ")"; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill(); }

    // ореол активної орбіти
    const halo = ringD(view.ring) - 2 * HALO_GAP;
    const g = ctx.createRadialGradient(cx, fy, 0, cx, fy, halo / 2);
    g.addColorStop(0, rgba(NEON.player, 0.12)); g.addColorStop(1, rgba(NEON.player, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, fy, halo / 2, 0, 7); ctx.fill();

    // орбіти
    for (let i = 0; i < view.rings; i++) {
      const active = i === view.ring;
      ctx.strokeStyle = active ? rgba(NEON.ring, 1) : rgba(NEON.ring, 0.55);
      ctx.lineWidth = active ? RING_TH_ACT : RING_TH;
      ctx.beginPath(); ctx.arc(cx, fy, ringD(i) / 2, 0, 7); ctx.stroke();
    }

    // здобич і шипи на орбітах — щоб було видно, як віньєтка з ними сусідить
    const r0 = ringD(0) / 2, r1 = ringD(view.rings - 1) / 2;
    const items = [
      { r: r1, a: view.angle + 40,  c: NEON.gem,   s: 7 },
      { r: r1, a: view.angle + 120, c: NEON.spike, s: 9 },
      { r: r0, a: -view.angle + 200, c: NEON.gem,  s: 7 },
      { r: r1, a: -view.angle + 290, c: BOOSTS[view.boost].color, s: 11 },
    ];
    for (const it of items) {
      const x = cx + Math.cos(it.a * Math.PI / 180) * it.r;
      const y = fy + Math.sin(it.a * Math.PI / 180) * it.r;
      const gg = ctx.createRadialGradient(x, y, 0, x, y, it.s * 1.8);
      gg.addColorStop(0, rgba(it.c, 0.55)); gg.addColorStop(1, rgba(it.c, 0));
      ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(x, y, it.s * 1.8, 0, 7); ctx.fill();
      ctx.fillStyle = it.c; ctx.beginPath(); ctx.arc(x, y, it.s / 2, 0, 7); ctx.fill();
    }

    // м'яч
    const br = ringD(view.ring) / 2;
    const bx = cx + Math.cos(view.angle * Math.PI / 180) * br;
    const by = fy + Math.sin(view.angle * Math.PI / 180) * br;
    const bg = ctx.createRadialGradient(bx, by, 0, bx, by, BALL * 2.2);
    bg.addColorStop(0, rgba(NEON.player, 0.5)); bg.addColorStop(1, rgba(NEON.player, 0));
    ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(bx, by, BALL * 2.2, 0, 7); ctx.fill();
    ctx.fillStyle = NEON.player; ctx.beginPath(); ctx.arc(bx, by, BALL / 2, 0, 7); ctx.fill();

    drawHud();
  }

  /** HUD: рахунок і APanelBooster (хекс 18×21 + смуга 64×3, база 64×31). */
  function drawHud() {
    const cx = SCREEN.w / 2;
    ctx.fillStyle = "rgba(255,255,255,.92)";
    ctx.font = "700 26px 'JetBrains Mono', monospace";
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.fillText("1 248", 22, HUD.top + 8);

    ctx.font = "600 11px 'IBM Plex Sans', system-ui, sans-serif";
    ctx.fillStyle = "rgba(255,255,255,.45)";
    ctx.fillText("COMBO x3", 22, HUD.top + 42);

    // панель буста праворуч у HUD
    const b = BOOSTS[view.boost];
    const px = SCREEN.w - 22 - 64, py = HUD.top + 10;
    const hexW = 18, hexH = 21;
    ctx.save();
    ctx.translate(px + 32, py + hexH / 2);
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (60 * i - 30) * Math.PI / 180;
      const x = Math.cos(a) * hexW / 2, y = Math.sin(a) * hexH / 2;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = b.color; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.fillStyle = rgba(b.color, 0.18); ctx.fill();
    ctx.restore();

    const barY = py + hexH + 7, frac = Math.max(0, Math.min(1, 1 - view.t / b.dur));
    ctx.fillStyle = "rgba(255,255,255,.2)";
    roundRect(px, barY, 64, 3, 1.5); ctx.fill();
    ctx.fillStyle = b.color;
    roundRect(px, barY, 64 * frac, 3, 1.5); ctx.fill();

    ctx.textAlign = "center";
    ctx.font = "700 9px 'IBM Plex Sans', system-ui, sans-serif";
    ctx.fillStyle = rgba(b.color, 0.9);
    ctx.fillText(b.label, px + 32, barY + 7);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(x, y, Math.max(0, w), h, r); return; }
    ctx.rect(x, y, Math.max(0, w), h);
  }

  /**
   * ВІНЬЄТКА. Профіль однаковий для затемнення й кольору:
   *   d      — відстань від центру, нормована (1 = кут екрана),
   *   alpha  = smoothstep(INNER → 1, d) ^ POW
   * У грі це запечеться у VfxTexture один раз; тут рахуємо градієнтом.
   */
  function drawVignette() {
    const env = envelope(view.t);
    if (env <= 0.001) return;

    const cx = SCREEN.w / 2, cy = SCREEN.h / 2;
    const inner = valOf("INNER"), pow = valOf("POW");
    const ellipse = valOf("ELLIPSE");
    const rOuter = ellipse ? SCREEN.h / 2 : Math.hypot(SCREEN.w, SCREEN.h) / 2;

    // 12 зупинок градієнта — достатньо, щоб крива читалась без смуг
    const stops = [];
    for (let i = 0; i <= 12; i++) {
      const d = i / 12;
      const x = d <= inner ? 0 : (d - inner) / (1 - inner);
      stops.push([d, Math.pow(x * x * (3 - 2 * x), pow)]);
    }

    const paint = (color, alpha, mode) => {
      if (alpha <= 0.001) return;
      ctx.save();
      ctx.globalCompositeOperation = mode;
      if (ellipse) { ctx.translate(cx, cy); ctx.scale(SCREEN.w / SCREEN.h, 1); ctx.translate(-cx, -cy); }
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rOuter);
      for (const [d, a] of stops) g.addColorStop(d, rgba(color, a * alpha * env));
      ctx.fillStyle = g;
      ctx.fillRect(-SCREEN.w, -SCREEN.h, SCREEN.w * 3, SCREEN.h * 3);
      ctx.restore();
    };

    paint("#000000", valOf("DARK_A"), "source-over");
    paint(vignetteColor(), tintAlphaFor(), valOf("ADDITIVE") ? "lighter" : "source-over");
  }

  let last = 0;
  function frame(now) {
    const dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
    last = now;
    if (view.running) {
      view.t += dt;
      const dur = BOOSTS[view.boost].dur;
      if (view.t > dur + valOf("FADE_OUT") + 0.6) { if (view.loop) view.t = 0; else view.running = false; }
    }
    view.angle = (view.angle + dt * 42) % 360;
    drawScene(dt);
    drawVignette();
    requestAnimationFrame(frame);
  }

  // ─────────────────────────────────────────────────────────────────────────
  //  UI
  // ─────────────────────────────────────────────────────────────────────────
  function sceneControls() {
    const wrap = el("div", "scene-bar");
    Object.keys(BOOSTS).forEach((k) => {
      const b = el("button", "chip", BOOSTS[k].label);
      b.type = "button";
      b.style.setProperty("--dot", BOOSTS[k].color);
      b.setAttribute("aria-pressed", String(view.boost === k));
      b.addEventListener("click", () => { view.boost = k; view.t = 0; view.running = true; renderScene(); });
      wrap.appendChild(b);
    });
    const again = el("button", "chip ghost", "↺ ще раз");
    again.type = "button";
    again.addEventListener("click", () => { view.t = 0; view.running = true; });
    wrap.appendChild(again);

    const loop = el("button", "chip ghost", "повторювати");
    loop.type = "button";
    loop.setAttribute("aria-pressed", String(view.loop));
    loop.addEventListener("click", () => { view.loop = !view.loop; renderScene(); });
    wrap.appendChild(loop);

    const rings = el("button", "chip ghost", view.rings === 3 ? "3 орбіти" : "2 орбіти");
    rings.type = "button";
    rings.addEventListener("click", () => { view.rings = view.rings === 3 ? 2 : 3; view.ring = Math.min(view.ring, view.rings - 1); renderScene(); });
    wrap.appendChild(rings);
    return wrap;
  }
  let sceneBarNode = null;
  function renderScene() {
    const fresh = sceneControls();
    sceneBarNode.replaceWith(fresh);
    sceneBarNode = fresh;
  }

  function paramRow(p) {
    const row = el("div", "row" + (isDef(p.key) ? "" : " changed"));
    const top = el("div", "top");
    const name = el("div", "name");
    const b = el("b", null, p.key); name.append(b, " · " + p.label);
    const val = el("div", "val", fmt(p, valOf(p.key)));
    top.append(name, val);
    row.appendChild(top);

    const set = (v) => {
      if (v === p.def) delete state.values[p.key]; else state.values[p.key] = v;
      saveDraft(); rerenderParams();
    };

    if (p.type === "bool" || p.type === "enum") {
      const seg = el("div", "seg");
      const opts = p.type === "bool"
        ? [{ v: true, t: "так" }, { v: false, t: "ні" }]
        : p.options;
      opts.forEach((o) => {
        const btn = el("button", null, o.t); btn.type = "button";
        btn.setAttribute("aria-pressed", String(valOf(p.key) === o.v));
        btn.disabled = locked();
        btn.addEventListener("click", () => set(o.v));
        seg.appendChild(btn);
      });
      row.appendChild(seg);
    } else {
      const r = el("input"); r.type = "range";
      r.min = p.min; r.max = p.max; r.step = p.step; r.value = valOf(p.key);
      r.disabled = locked();
      r.addEventListener("input", () => { val.textContent = fmt(p, Number(r.value)); });
      r.addEventListener("change", () => set(Number(r.value)));
      row.appendChild(r);
    }

    const foot = el("div", "hint");
    foot.append(p.hint ? p.hint + " · " : "");
    const def = el("span", "def", "дефолт " + fmt(p, p.def));
    foot.appendChild(def);
    if (!isDef(p.key) && !locked()) {
      const rst = el("button", "reset", "↺"); rst.type = "button";
      rst.addEventListener("click", () => set(p.def));
      foot.append(" ", rst);
    }
    row.appendChild(foot);
    return row;
  }

  let paramsNode = null;
  function paramsBlock() {
    const box = el("div");
    Object.keys(GROUPS).forEach((gk) => {
      const g = GROUPS[gk];
      const sec = el("section", "group");
      const head = el("header");
      head.appendChild(el("h2", null, g.title));
      head.appendChild(el("div", "sub", g.sub));
      head.appendChild(el("p", "desc", g.desc));
      sec.appendChild(head);
      const rows = el("div", "rows");
      PARAMS.filter((p) => p.g === gk).forEach((p) => rows.appendChild(paramRow(p)));
      sec.appendChild(rows);
      box.appendChild(sec);
    });
    return box;
  }
  function rerenderParams() {
    const fresh = paramsBlock();
    paramsNode.replaceWith(fresh);
    paramsNode = fresh;
    renderBar();
  }

  function render() {
    const root = $("root"); root.innerHTML = "";
    root.appendChild(el("div", "eyebrow", "Тюнер · майбутній патч " + data.id));
    root.appendChild(el("h1", null, data.title));
    root.appendChild(el("p", null,
      "Екран, орбіти, м'яч і HUD намальовані справжніми числами гри (360×825, поле 320, орбіти 190/320 і 130/225/320). " +
      "Віньєтка рахується тією ж формулою, яку я перенесу в шейдер. Повзунки підписані іменами майбутніх констант."));

    const stage = el("div", "stage"); stage.appendChild(canvas);
    root.appendChild(stage);
    sceneBarNode = sceneControls(); root.appendChild(sceneBarNode);

    paramsNode = paramsBlock(); root.appendChild(paramsNode);

    const noteBox = el("section", "group");
    const nh = el("header"); nh.appendChild(el("h2", null, "Коментар"));
    nh.appendChild(el("p", "desc", "Те, що повзунками не передати: «на SYNTH занадто», «хочу теплішим»."));
    noteBox.appendChild(nh);
    const nr = el("div", "rows");
    const ta = el("textarea"); ta.value = state.note || ""; ta.disabled = locked();
    ta.addEventListener("input", () => { state.note = ta.value; saveDraft(); });
    nr.appendChild(ta); noteBox.appendChild(nr);
    root.appendChild(noteBox);

    renderBar();
  }

  // ── панель «Готово» ──────────────────────────────────────────────────────
  let artifactApi = null, busy = false;
  function renderBar() {
    const bar = $("bar"); bar.innerHTML = "";
    const inner = el("div", "bar-inner");
    const status = el("div", "status");

    const changed = Object.keys(state.values).length;
    if (state.result) {
      status.appendChild(el("span", "pill done", "Перенесено"));
      status.appendChild(el("span", null, state.result.note || ""));
    } else if (locked()) {
      status.appendChild(el("span", "pill sent", "Надіслано"));
      status.appendChild(el("span", null, new Date(state.submitted).toLocaleString("uk-UA") + " — напиши в чат, Claude прочитає"));
    } else {
      status.appendChild(el("span", null, changed ? "змінено значень: " + changed : "усе на дефолтах"));
      if (!artifactApi) status.appendChild(el("span", null, "· надіслати можна на claude.ai"));
    }
    inner.appendChild(status);

    const send = el("button", "send", locked() ? "Змінити вибір" : "Готово — надіслати Claude");
    send.type = "button";
    if (locked()) send.className = "send ghost";
    send.disabled = !artifactApi || busy || !!state.result;
    send.addEventListener("click", () => {
      if (!artifactApi || busy) return;
      if (locked()) { state.submitted = null; } else {
        const full = {};
        PARAMS.forEach((p) => { full[p.key] = valOf(p.key); });
        state.values = full;
        state.submitted = new Date().toISOString();
      }
      publish();
    });
    inner.appendChild(send);
    bar.appendChild(inner);
  }

  function buildDocument() {
    const style = document.getElementById("style").outerHTML;
    const app = document.getElementById("app").textContent;
    const json = JSON.stringify(data).replace(/</g, "\\u003c");
    return "<!doctype html><html lang=\"uk\"><head><meta charset=\"utf-8\">" +
      "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">" +
      "<title>" + document.title.replace(/</g, "&lt;") + "</title>" + style +
      "</head><body><main class=\"page\" id=\"root\"></main><div class=\"bar\" id=\"bar\"></div>" +
      "<script id=\"tuner-data\" type=\"application/json\">" + json + "<\/script>" +
      "<script id=\"app\">" + app + "<\/script></body></html>";
  }

  async function publish() {
    busy = true; renderBar();
    try {
      await artifactApi.publish(buildDocument());
      try { localStorage.removeItem(DRAFT_KEY); } catch (e) { /* немає сховища */ }
    } catch (e) {
      busy = false;
      if (e && e.code === "conflict") return;
      state.submitted = null;
      render();
      $("status") && $("status").appendChild(el("span", null, "не вдалось надіслати — напиши в чат"));
    }
  }

  loadDraft();
  render();
  resizeCanvas();
  window.addEventListener("resize", resizeCanvas);
  requestAnimationFrame(frame);

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then((api) => { artifactApi = api; renderBar(); })
      .catch(() => { artifactApi = null; renderBar(); });
  }
})();
</script>
</body>
</html>
